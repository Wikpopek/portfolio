<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photography — wikivisual.co</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fbfaf8;
      color: #151515;
      font-family: "IBM Plex Mono", monospace;
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: "IBM Plex Mono", monospace;
    }

    /* =========================
       PAGE
    ========================= */

    .photography-page {
      width: 100%;
      min-height: 100vh;
      padding: 22px 34px 26px;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }

    .logo {
      font-size: clamp(24px, 2vw, 38px);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
      color: #111;
    }

    .section-title {
      margin-top: 9px;
      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #777;
    }

    /* =========================
       NAV
    ========================= */

    .top-nav {
      position: absolute;
      top: 1px;
      right: 0;

      display: flex;
      gap: 28px;

      z-index: 9999;

      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #555;
    }

    .top-nav a {
      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .top-nav a:hover {
      opacity: 0.5;
      transform: translateY(-1px);
    }

    /* =========================
       DESKTOP COLLAGE
    ========================= */

    .collage {
      position: relative;

      width: min(1500px, 96vw);

      height: min(
        760px,
        calc(100vh - 105px)
      );

      min-height: 650px;

      margin: 10px auto 0;
    }

    .photo-card {
      position: absolute;
      display: block;

      padding: 0;
      border: none;

      background: transparent;

      cursor: pointer;

      z-index: 3;

      overflow: visible;

      transition:
        transform 0.5s cubic-bezier(.22,.61,.36,1),
        opacity 0.3s ease;
    }

    .photo-card:hover {
      z-index: 30;
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* PORTRAIT */

    .portrait-card {
      width: 22%;
      left: 10%;
      top: 8%;
      transform: rotate(5deg);
    }

    .portrait-card:hover {
      transform:
        rotate(3deg)
        scale(1.012);
    }

    /* COUPLES */

    .couples-card {
      width: 22%;
      left: 38%;
      top: 20%;
      transform: rotate(-2deg);
    }

    .couples-card:hover {
      transform:
        rotate(-1deg)
        scale(1.01);
    }

    /* TRAVEL */

    .travel-card {
      width: 23%;
      right: 7%;
      top: 10%;
      transform: rotate(4deg);
    }

    .travel-card:hover {
      transform:
        rotate(2deg)
        scale(1.01);
    }

    /* STUDIO */

    .studio-card {
      width: 19%;
      right: 10%;
      bottom: 4%;
      transform: rotate(-4deg);
    }

    .studio-card:hover {
      transform:
        rotate(-2deg)
        scale(1.012);
    }

    /* =========================
       LABELS
    ========================= */

    .label {
      position: absolute;
      z-index: 40;

      font-size: clamp(8px, 0.66vw, 11px);
      font-weight: 300;

      letter-spacing: 0.13em;
      text-transform: uppercase;

      white-space: nowrap;
      color: #333;
    }

    .portrait-label {
      left: 2%;
      top: 15%;
    }

    .couples-label {
      left: 29%;
      bottom: 12%;
    }

    .travel-label {
      right: 1.5%;
      top: 11%;
    }

    .studio-label {
      right: 2%;
      bottom: 13%;
    }

    /* =========================
       ARROWS
    ========================= */

    .arrow {
      position: absolute;
      overflow: visible;
      z-index: 41;
      pointer-events: none;
    }

    .arrow path {
      fill: none;
      stroke: #393939;
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .portrait-arrow {
      left: 3.5%;
      top: 18%;
      width: 85px;
      height: 62px;
    }

    .couples-arrow {
      left: 31%;
      bottom: 15%;
      width: 105px;
      height: 80px;
    }

    .travel-arrow {
      right: 6%;
      top: 13%;
      width: 110px;
      height: 90px;
    }

    .studio-arrow {
      right: 7%;
      bottom: 15%;
      width: 100px;
      height: 80px;
    }

    /* =========================
       DESKTOP PLASTIC
    ========================= */

    .glass {
      position: absolute;

      z-index: 15;

      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.63) 0,
          rgba(255,255,255,0.63) 5px,
          rgba(190,190,190,0.18) 6px,
          rgba(255,255,255,0.25) 11px
        );

      backdrop-filter: blur(11px);
      -webkit-backdrop-filter: blur(11px);

      opacity: 0.82;

      pointer-events: none;
    }

    .glass-1 {
      width: 9%;
      height: 18%;
      left: 4%;
      top: 31%;
      transform: rotate(-7deg);
    }

    .glass-2 {
      width: 9%;
      height: 18%;
      left: 55%;
      top: 26%;
      transform: rotate(-5deg);
    }

    .glass-3 {
      width: 9%;
      height: 17%;
      right: 5%;
      top: 35%;
      transform: rotate(9deg);
    }

    .glass-4 {
      width: 8%;
      height: 15%;
      right: 23%;
      bottom: 5%;
      transform: rotate(-8deg);
    }

    /* =========================
       MODAL
    ========================= */

    .gallery-modal {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 28px;

      background: rgba(242,239,234,0.86);

      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);

      opacity: 0;
      visibility: hidden;

      z-index: 5000;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .gallery-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .gallery-panel {
      position: relative;

      width: min(1250px, 95vw);
      max-height: 92vh;

      overflow-y: auto;

      background: #fbfaf8;

      padding: 30px 24px;

      box-shadow:
        0 18px 55px rgba(0,0,0,0.13);
    }

    /* =========================
       MODAL HEADER
    ========================= */

    .gallery-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 34px;
    }

    .gallery-logo {
      font-size: clamp(20px, 1.6vw, 30px);
      font-weight: 600;
      letter-spacing: -0.06em;
    }

    .gallery-title {
      margin-top: 9px;

      font-size: 10px;
      font-weight: 300;

      letter-spacing: 0.28em;
      text-transform: uppercase;

      color: #777;
    }

    .close-gallery {
      position: absolute;

      top: 20px;
      right: 24px;

      border: none;
      background: transparent;

      font-size: 22px;
      color: #333;

      cursor: pointer;
    }

    /* =========================
       FOLDERS
    ========================= */

    .folders-view {
      display: block;
    }

    .folders-view.hidden {
      display: none;
    }

    .folders-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .folder-card {
      border: none;
      background: transparent;

      cursor: pointer;

      text-align: center;
      color: #151515;
    }

    .folder-preview {
      width: 100%;
      height: 360px;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      overflow: hidden;

      margin-bottom: 13px;
    }

    .folder-preview img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;
      object-position: center bottom;
    }

    .folder-name {
      font-size: 10px;
      font-weight: 300;

      letter-spacing: 0.2em;
      text-transform: uppercase;

      color: #333;
    }

    /* =========================
       PERSON GALLERY
    ========================= */

    .person-gallery-view {
      display: none;
    }

    .person-gallery-view.active {
      display: block;
    }

    .gallery-person-header {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 28px;
    }

    .back-button {
      position: absolute;
      left: 0;

      border: none;
      background: transparent;

      cursor: pointer;

      font-size: 9px;
      font-weight: 300;

      letter-spacing: 0.16em;
      text-transform: uppercase;

      color: #555;
    }

    .person-gallery-title {
      font-size: 11px;
      font-weight: 300;

      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    /* =========================
       JUSTIFIED GALLERY
    ========================= */

    .portrait-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gallery-row {
      width: 100%;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .portrait-item {
      flex: 0 0 auto;
      display: block;
      overflow: hidden;
      cursor: pointer;
    }

    .portrait-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* =========================
       LIGHTBOX
    ========================= */

    .lightbox {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(10,10,10,0.94);

      opacity: 0;
      visibility: hidden;

      z-index: 99999;
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-content {
      position: relative;

      width: min(1250px, 95vw);
      height: 94vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;
    }

    .lightbox-main {
      max-width: 82vw;
      max-height: 76vh;

      width: auto;
      height: auto;

      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;

      top: 8px;
      right: 8px;

      border: none;
      background: transparent;

      color: #fff;
      font-size: 27px;

      cursor: pointer;
    }

    .lightbox-arrow {
      position: absolute;

      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #fff;
      font-size: 46px;

      cursor: pointer;

      opacity: 0.7;
    }

    .lightbox-prev {
      left: 14px;
    }

    .lightbox-next {
      right: 14px;
    }

    .lightbox-thumbs {
      display: flex;
      gap: 7px;

      margin-top: 17px;

      max-width: 92vw;

      overflow-x: auto;
    }

    .lightbox-thumbs img {
      flex: 0 0 auto;

      width: 48px;
      height: 62px;

      object-fit: cover;

      opacity: 0.4;

      cursor: pointer;
    }

    .lightbox-thumbs img.active {
      opacity: 1;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1000px) {

      .folders-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 850px) {

      .photography-page {
        padding:
          20px
          16px
          60px;
      }

      .site-header {
        align-items: flex-start;
      }

      .logo {
        font-size: 28px;
      }

      .section-title {
        margin-top: 8px;
        font-size: 9px;
      }

      .top-nav {
        position: static;

        width: 100%;

        margin-top: 20px;

        justify-content: flex-start;
        flex-wrap: wrap;

        gap: 16px;

        font-size: 9px;
      }

      /* MOBILE LIST */

      .collage {
        position: relative;

        width: 100%;

        height: auto;
        min-height: 0;

        margin:
          44px
          auto
          0;

        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 92px;
      }

      .photo-card,
      .portrait-card,
      .couples-card,
      .travel-card,
      .studio-card {
        position: relative !important;

        inset: auto !important;

        width:
          min(
            360px,
            88vw
          ) !important;

        height: auto !important;

        display: block;

        padding: 0;

        border: none;

        background: transparent;

        transform: none !important;

        overflow: visible;

        z-index: 10;
      }

      .photo-card img {
        position: relative;

        z-index: 1;

        width: 100%;
        height: auto;

        display: block;

        object-fit: contain;
        object-position: center;
      }

      /* BIG PLASTIC OVER BOTTOM OF PHOTO */

      .photo-card::before {
        content: "";

        position: absolute;

        z-index: 5;

        width: 118px;
        height: 132px;

        bottom: -40px;

        pointer-events: none;

        background:
          repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.72) 0,
            rgba(255,255,255,0.72) 8px,
            rgba(185,185,185,0.23) 9px,
            rgba(255,255,255,0.30) 17px
          );

        backdrop-filter: blur(13px);
        -webkit-backdrop-filter: blur(13px);

        opacity: 0.88;
      }

      .portrait-card::before {
        left: 7%;
        transform: rotate(-7deg);
      }

      .couples-card::before {
        right: 7%;
        transform: rotate(7deg);
      }

      .travel-card::before {
        left: 13%;
        transform: rotate(-5deg);
      }

      .studio-card::before {
        right: 11%;
        transform: rotate(6deg);
      }

      /* MOBILE TITLES */

      .photo-card::after {
        position: relative;

        z-index: 8;

        display: block;

        margin-top: 32px;

        text-align: center;

        font-size: 10px;
        font-weight: 400;

        letter-spacing: 0.16em;
        text-transform: uppercase;

        color: #222;
      }

      .portrait-card::after {
        content: "Portrait";
      }

      .couples-card::after {
        content: "Couples";
      }

      .travel-card::after {
        content: "Travel";
      }

      .studio-card::after {
        content: "Studio";
      }

      /* hide desktop stuff */

      .label,
      .arrow,
      .collage > .glass {
        display: none;
      }

      /* MOBILE MODAL */

      .gallery-modal {
        padding: 12px;
      }

      .gallery-panel {
        width: 100%;
        max-height: 94vh;

        padding:
          26px
          14px
          22px;
      }

      .folders-grid {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 16px;
      }

      .folder-preview {
        height: 240px;
      }

      .lightbox-main {
        max-width: 88vw;
        max-height: 70vh;
      }

    }

    /* =====================================================
       SMALL PHONE
    ===================================================== */

    @media (max-width: 520px) {

      .photography-page {
        padding:
          18px
          14px
          55px;
      }

      .logo {
        font-size: 25px;
      }

      .top-nav {
        gap: 14px;
        font-size: 8px;
      }

      .collage {
        margin-top: 38px;
        gap: 84px;
      }

      .photo-card,
      .portrait-card,
      .couples-card,
      .travel-card,
      .studio-card {
        width:
          min(
            330px,
            92vw
          ) !important;
      }

      .photo-card::before {
        width: 100px;
        height: 116px;

        bottom: -36px;
      }

      .portrait-card::before {
        left: 5%;
      }

      .couples-card::before {
        right: 5%;
      }

      .travel-card::before {
        left: 11%;
      }

      .studio-card::before {
        right: 8%;
      }

      .photo-card::after {
        margin-top: 28px;
        font-size: 9px;
      }

      .gallery-modal {
        padding: 8px;
      }

      .gallery-panel {
        width: 100%;
        max-height: 95vh;

        padding:
          24px
          10px
          20px;
      }

      .folders-grid {
        grid-template-columns: 1fr;
      }

      .folder-preview {
        height: auto;
      }

      .folder-preview img {
        height: auto;
      }

      .lightbox-main {
        max-width: 90vw;
        max-height: 68vh;
      }

    }

  </style>

</head>


<body>

  <main class="photography-page">

    <!-- HEADER -->

    <header class="site-header">

      <a
        href="index.html"
        class="logo"
      >
        wikivisual.co
      </a>

      <div class="section-title">
        Photography
      </div>

      <nav class="top-nav">

        <a href="digital-design.html">
          Digital Design
        </a>

        <a href="about.html">
          About Me
        </a>

        <a href="contact.html">
          Contact
        </a>

      </nav>

    </header>


    <!-- COLLAGE -->

    <section class="collage">


      <!-- PORTRAIT -->

      <button
        class="photo-card portrait-card"
        id="openPortraits"
        type="button"
      >

        <img
          src="images/monika/monika-01.JPG"
          alt="Portrait photography"
        >

      </button>


      <!-- COUPLES -->

      <button
        class="photo-card couples-card"
        id="openCouples"
        type="button"
      >

        <img
          src="images/gabi-konrad/gabi-konrad-01.jpeg"
          alt="Couples photography"
        >

      </button>


      <!-- TRAVEL -->

      <button
        class="photo-card travel-card"
        id="openTravel"
        type="button"
      >

        <img
          src="images/maine/maine-01.jpg"
          alt="Travel photography"
        >

      </button>


      <!-- STUDIO -->

      <button
        class="photo-card studio-card"
        id="openStudio"
        type="button"
      >

        <img
          src="images/daniela-studio/daniela-studio-01.jpg"
          alt="Studio photography"
        >

      </button>


      <!-- DESKTOP LABELS -->

      <div class="label portrait-label">
        Portrait
      </div>

      <div class="label couples-label">
        Couples
      </div>

      <div class="label travel-label">
        Travel
      </div>

      <div class="label studio-label">
        Studio
      </div>


      <!-- DESKTOP ARROWS -->

      <svg
        class="arrow portrait-arrow"
        viewBox="0 0 85 62"
      >
        <path d="M 4 4 C 10 25, 27 42, 63 47"/>
        <path d="M 55 40 L 64 47 L 54 52"/>
      </svg>


      <svg
        class="arrow couples-arrow"
        viewBox="0 0 105 80"
      >
        <path d="M 5 70 C 26 62, 48 46, 78 18"/>
        <path d="M 66 21 L 80 16 L 76 31"/>
      </svg>


      <svg
        class="arrow travel-arrow"
        viewBox="0 0 110 90"
      >
        <path d="M 103 6 C 85 18, 69 33, 43 58"/>
        <path d="M 54 44 L 41 59 L 59 55"/>
      </svg>


      <svg
        class="arrow studio-arrow"
        viewBox="0 0 100 80"
      >
        <path d="M 95 68 C 74 60, 55 44, 34 22"/>
        <path d="M 45 26 L 32 20 L 36 34"/>
      </svg>


      <!-- DESKTOP PLASTIC -->

      <div class="glass glass-1"></div>
      <div class="glass glass-2"></div>
      <div class="glass glass-3"></div>
      <div class="glass glass-4"></div>


    </section>

  </main>


  <!-- CATEGORY MODAL -->

  <div
    class="gallery-modal"
    id="galleryModal"
  >

    <div class="gallery-panel">


      <button
        class="close-gallery"
        id="closeGallery"
        type="button"
      >
        ×
      </button>


      <div class="gallery-top">

        <div class="gallery-logo">
          wikivisual.co
        </div>

        <div
          class="gallery-title"
          id="categoryTitle"
        >
          Portraits
        </div>

      </div>


      <div
        class="folders-view"
        id="foldersView"
      >

        <div
          class="folders-grid"
          id="foldersGrid"
        ></div>

      </div>


      <div
        class="person-gallery-view"
        id="personGalleryView"
      >

        <div class="gallery-person-header">

          <button
            class="back-button"
            id="backToFolders"
            type="button"
          >
            ← Back
          </button>

          <div
            class="person-gallery-title"
            id="personGalleryTitle"
          ></div>

        </div>


        <div
          class="portrait-grid"
          id="portraitGrid"
        ></div>


      </div>

    </div>

  </div>


  <!-- LIGHTBOX -->

  <div
    class="lightbox"
    id="lightbox"
  >

    <div class="lightbox-content">


      <button
        class="lightbox-close"
        id="closeLightbox"
        type="button"
      >
        ×
      </button>


      <button
        class="lightbox-arrow lightbox-prev"
        id="prevImage"
        type="button"
      >
        ‹
      </button>


      <img
        src=""
        alt=""
        class="lightbox-main"
        id="lightboxMain"
      >


      <button
        class="lightbox-arrow lightbox-next"
        id="nextImage"
        type="button"
      >
        ›
      </button>


      <div
        class="lightbox-thumbs"
        id="lightboxThumbs"
      ></div>


    </div>

  </div>


  <script>

    const galleries = {

      monika: [
        "images/monika/monika-01.JPG",
        "images/monika/monika-19.jpg",
        "images/monika/monika-20.jpg",
        "images/monika/monika-21.jpg",
        "images/monika/monika-22.jpg",

    const openPortraits =
      document.getElementById("openPortraits");

    const openCouples =
      document.getElementById("openCouples");

    const openTravel =
      document.getElementById("openTravel");

    const openStudio =
      document.getElementById("openStudio");


    const galleryModal =
      document.getElementById("galleryModal");

    const closeGallery =
      document.getElementById("closeGallery");

    const categoryTitle =
      document.getElementById("categoryTitle");

    const foldersView =
      document.getElementById("foldersView");

    const foldersGrid =
      document.getElementById("foldersGrid");

    const personGalleryView =
      document.getElementById("personGalleryView");

    const personGalleryTitle =
      document.getElementById("personGalleryTitle");

    const backToFolders =
      document.getElementById("backToFolders");

    const portraitGrid =
      document.getElementById("portraitGrid");


    const lightbox =
      document.getElementById("lightbox");

    const lightboxMain =
      document.getElementById("lightboxMain");

    const lightboxThumbs =
      document.getElementById("lightboxThumbs");

    const closeLightbox =
      document.getElementById("closeLightbox");

    const prevImage =
      document.getElementById("prevImage");

    const nextImage =
      document.getElementById("nextImage");


    let currentCategory = "";
    let currentGallery = [];
    let currentImageIndex = 0;


    function openCategory(categoryKey) {

      currentCategory =
        categoryKey;

      categoryTitle.textContent =
        categories[categoryKey].title;

      renderFolders();

      galleryModal.classList.add(
        "active"
      );

      document.body.classList.add(
        "modal-open"
      );

      showFolders();

    }


    openPortraits.addEventListener(
      "click",
      () => openCategory("portraits")
    );


    openCouples.addEventListener(
      "click",
      () => openCategory("couples")
    );


    openTravel.addEventListener(
      "click",
      () => openCategory("travel")
    );


    openStudio.addEventListener(
      "click",
      () => openCategory("studio")
    );


    function renderFolders() {

      foldersGrid.innerHTML = "";

      const folderData =
        categories[currentCategory].folders;


      folderData.forEach(folder => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "folder-card";

        button.type =
          "button";


        button.innerHTML = `

          <div class="folder-preview">

            <img
              src="${folder.preview}"
              alt="${folder.name}"
            >

          </div>

          <div class="folder-name">
            ${folder.name}
          </div>

        `;


        button.addEventListener(
          "click",
          () => {

            openGallery(
              folder.key,
              folder.name
            );

          }
        );


        foldersGrid.appendChild(
          button
        );

      });

    }


    function showFolders() {

      foldersView.classList.remove(
        "hidden"
      );

      personGalleryView.classList.remove(
        "active"
      );

      portraitGrid.innerHTML = "";

    }


    function closeCategoryModal() {

      galleryModal.classList.remove(
        "active"
      );

      document.body.classList.remove(
        "modal-open"
      );

      showFolders();

    }


    closeGallery.addEventListener(
      "click",
      closeCategoryModal
    );


    galleryModal.addEventListener(
      "click",
      event => {

        if (
          event.target === galleryModal
        ) {
          closeCategoryModal();
        }

      }
    );


    function getImageInfo(
      src,
      index
    ) {

      return new Promise(resolve => {

        const image =
          new Image();


        image.onload = () => {

          resolve({
            src,
            index,

            ratio:
              image.naturalWidth /
              image.naturalHeight
          });

        };


        image.onerror = () => {

          resolve({
            src,
            index,
            ratio: 1
          });

        };


        image.src = src;

      });

    }


    function createJustifiedRow(
      photos,
      galleryWidth,
      gap
    ) {

      if (
        photos.length === 0
      ) {
        return;
      }


      const row =
        document.createElement(
          "div"
        );

      row.className =
        "gallery-row";


      const totalRatio =
        photos.reduce(
          (sum, photo) =>
            sum + photo.ratio,
          0
        );


      const totalGap =
        gap *
        (
          photos.length - 1
        );


      const availableWidth =
        galleryWidth -
        totalGap;


      const rowHeight =
        availableWidth /
        totalRatio;


      photos.forEach(photo => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "portrait-item";


        item.style.width =
          `${
            rowHeight *
            photo.ratio
          }px`;


        item.style.height =
          `${rowHeight}px`;


        const img =
          document.createElement(
            "img"
          );


        img.src =
          photo.src;


        img.addEventListener(
          "click",
          () => {

            openLightbox(
              photo.index
            );

          }
        );


        item.appendChild(img);

        row.appendChild(item);

      });


      portraitGrid.appendChild(row);

    }


    async function openGallery(
      galleryKey,
      displayName
    ) {

      currentGallery =
        galleries[galleryKey] || [];


      foldersView.classList.add(
        "hidden"
      );


      personGalleryView.classList.add(
        "active"
      );


      personGalleryTitle.textContent =
        displayName;


      portraitGrid.innerHTML = "";


      await new Promise(
        resolve =>
          requestAnimationFrame(
            resolve
          )
      );


      const imageData =
        await Promise.all(

          currentGallery.map(
            (src, index) =>
              getImageInfo(
                src,
                index
              )
          )

        );


      const galleryWidth =
        portraitGrid.clientWidth;


      let targetHeight = 255;


      if (
        window.innerWidth < 850
      ) {
        targetHeight = 210;
      }


      if (
        window.innerWidth < 580
      ) {
        targetHeight = 165;
      }


      const gap = 10;

      let row = [];

      let ratio = 0;


      imageData.forEach(photo => {

        row.push(photo);

        ratio += photo.ratio;


        const estimatedWidth =
          (
            ratio *
            targetHeight
          )
          +
          (
            gap *
            (
              row.length - 1
            )
          );


        if (
          estimatedWidth >=
          galleryWidth
        ) {

          createJustifiedRow(
            row,
            galleryWidth,
            gap
          );

          row = [];

          ratio = 0;

        }

      });


      if (
        row.length > 0
      ) {

        createJustifiedRow(
          row,
          galleryWidth,
          gap
        );

      }

    }


    backToFolders.addEventListener(
      "click",
      showFolders
    );


    function openLightbox(index) {

      currentImageIndex =
        index;

      createThumbnails();

      updateLightbox();

      lightbox.classList.add(
        "active"
      );

    }


    function updateLightbox() {

      lightboxMain.src =
        currentGallery[
          currentImageIndex
        ];


      const thumbs =
        document.querySelectorAll(
          ".lightbox-thumbs img"
        );


      thumbs.forEach(
        (thumb, index) => {

          thumb.classList.toggle(
            "active",
            index === currentImageIndex
          );

        }
      );

    }


    function createThumbnails() {

      lightboxThumbs.innerHTML = "";


      currentGallery.forEach(
        (src, index) => {

          const img =
            document.createElement(
              "img"
            );


          img.src = src;


          img.addEventListener(
            "click",
            () => {

              currentImageIndex =
                index;

              updateLightbox();

            }
          );


          lightboxThumbs.appendChild(
            img
          );

        }
      );

    }


    nextImage.addEventListener(
      "click",
      () => {

        currentImageIndex++;

        if (
          currentImageIndex >=
          currentGallery.length
        ) {
          currentImageIndex = 0;
        }

        updateLightbox();

      }
    );


    prevImage.addEventListener(
      "click",
      () => {

        currentImageIndex--;

        if (
          currentImageIndex < 0
        ) {
          currentImageIndex =
            currentGallery.length - 1;
        }

        updateLightbox();

      }
    );


    function closeImageLightbox() {

      lightbox.classList.remove(
        "active"
      );

    }


    closeLightbox.addEventListener(
      "click",
      closeImageLightbox
    );


    lightbox.addEventListener(
      "click",
      event => {

        if (
          event.target === lightbox
        ) {
          closeImageLightbox();
        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          lightbox.classList.contains(
            "active"
          )
        ) {

          if (
            event.key === "ArrowLeft"
          ) {
            prevImage.click();
          }

          if (
            event.key === "ArrowRight"
          ) {
            nextImage.click();
          }

          if (
            event.key === "Escape"
          ) {
            closeImageLightbox();
          }

          return;

        }


        if (
          event.key === "Escape" &&
          galleryModal.classList.contains(
            "active"
          )
        ) {

          if (
            personGalleryView
              .classList
              .contains(
                "active"
              )
          ) {

            showFolders();

          }

          else {

            closeCategoryModal();

          }

        }

      }
    );

  </script>
