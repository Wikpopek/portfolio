<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photography — wikivisual.co</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fbfaf8;
      color: #151515;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       PAGE
       ========================= */

    .photography-page {
      width: 100%;
      min-height: 100vh;

      padding:
        22px
        34px
        26px;
    }

    /* =========================
       HEADER
       ========================= */

    .site-header {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;

      z-index: 50;
    }

    /* =========================
       LOGO
       ========================= */

    .logo {
      font-size: clamp(26px, 2vw, 42px);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1;

      color: #111;
    }

    /* =========================
       PHOTOGRAPHY TITLE
       ========================= */

    .section-title {
      margin-top: 10px;

      font-family:
        "IBM Plex Mono",
        monospace;

      font-size:
        clamp(9px, 0.7vw, 12px);

      font-weight: 300;

      letter-spacing: 0.28em;
      text-transform: uppercase;

      color: #777;
    }

    /* =========================
       TOP NAV
       ========================= */

    .top-nav {
      position: absolute;

      top: 0;
      right: 0;

      display: flex;
      align-items: center;

      gap: 30px;

      font-family:
        "IBM Plex Mono",
        monospace;

      font-size:
        clamp(9px, 0.7vw, 12px);

      font-weight: 300;

      letter-spacing: 0.18em;
      text-transform: uppercase;

      color: #555;
    }

    .top-nav a {
      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    .top-nav a:hover {
      opacity: 0.5;
      transform: translateY(-1px);
    }

    /* =========================
       COLLAGE
       ========================= */

    .collage {
      position: relative;

      width: min(1500px, 96vw);

      height: min(
        760px,
        calc(100vh - 105px)
      );

      min-height: 620px;

      margin: 10px auto 0;
    }

    /* =========================
       PHOTO CARDS
       ========================= */

    .photo-card {
      position: absolute;

      display: block;

      background: #e7e3dc;

      overflow: hidden;

      z-index: 3;

      border: none;

      box-shadow:
        0 10px 24px
        rgba(0,0,0,0.055);

      transition:
        transform 0.5s
        cubic-bezier(.22,.61,.36,1),
        box-shadow 0.5s ease;
    }

    .photo-card:hover {
      z-index: 20;

      box-shadow:
        0 14px 28px
        rgba(0,0,0,0.08);
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #ece9e4,
          #ddd8d0
        );

      font-family:
        "IBM Plex Mono",
        monospace;

      font-size: 10px;

      font-weight: 300;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      color:
        rgba(0,0,0,0.24);
    }

    /* =========================
       CARD POSITIONS
       ========================= */

    .portrait-card {
      width: 29%;
      height: 42%;

      left: 8%;
      top: 6%;

      transform: rotate(6deg);
    }

    .portrait-card:hover {
      transform:
        rotate(4deg)
        scale(1.012);
    }

    .nyc-card {
      width: 31%;
      height: 35%;

      left: 38%;
      top: 19%;

      transform: rotate(-1deg);
    }

    .nyc-card:hover {
      transform:
        rotate(0deg)
        scale(1.012);
    }

    .street-card {
      width: 22%;
      height: 40%;

      right: 6%;
      top: 8%;

      transform: rotate(4deg);
    }

    .street-card:hover {
      transform:
        rotate(2deg)
        scale(1.012);
    }

    .couples-card {
      width: 19%;
      height: 35%;

      left: 12%;
      bottom: 5%;

      transform: rotate(-7deg);
    }

    .couples-card:hover {
      transform:
        rotate(-5deg)
        scale(1.012);
    }

    .studio-card {
      width: 28%;
      height: 36%;

      left: 34%;
      bottom: 2%;

      transform: rotate(2deg);
    }

    .studio-card:hover {
      transform:
        rotate(1deg)
        scale(1.012);
    }

    .travel-card {
      width: 25%;
      height: 36%;

      right: 8%;
      bottom: 3%;

      transform: rotate(-5deg);
    }

    .travel-card:hover {
      transform:
        rotate(-3deg)
        scale(1.012);
    }

    /* =========================
       LABELS
       ========================= */

    .label {
      position: absolute;

      z-index: 30;

      font-family:
        "IBM Plex Mono",
        monospace;

      font-size:
        clamp(8px, 0.66vw, 11px);

      font-weight: 300;

      letter-spacing: 0.13em;

      text-transform: uppercase;

      white-space: nowrap;

      color: #333;
    }

    .portrait-label {
      left: 0.7%;
      top: 14%;
    }

    .nyc-label {
      left: 59%;
      top: 12%;
    }

    .street-label {
      right: 0.3%;
      top: 9%;
    }

    .couples-label {
      left: 1%;
      bottom: 24%;
    }

    .studio-label {
      left: 28%;
      bottom: 2%;
    }

    .travel-label {
      right: 0.2%;
      bottom: 25%;
    }

    /* =========================
       CURVED ARROWS
       ========================= */

    .arrow {
      position: absolute;

      overflow: visible;

      z-index: 29;

      pointer-events: none;
    }

    .arrow path {
      fill: none;

      stroke: #393939;

      stroke-width: 1.1;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .portrait-arrow {
      left: 2.5%;
      top: 17%;

      width: 85px;
      height: 62px;
    }

    .nyc-arrow {
      left: 60%;
      top: 15%;

      width: 65px;
      height: 80px;
    }

    .street-arrow {
      right: 1.2%;
      top: 12%;

      width: 65px;
      height: 75px;
    }

    .couples-arrow {
      left: 3%;
      bottom: 16%;

      width: 90px;
      height: 65px;
    }

    .studio-arrow {
      left: 30%;
      bottom: 7%;

      width: 72px;
      height: 70px;
    }

    .travel-arrow {
      right: 2%;
      bottom: 17%;

      width: 85px;
      height: 70px;
    }

    /* =========================
       GLASS DETAILS
       ========================= */

    .glass {
      position: absolute;

      z-index: 15;

      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.63) 0,
          rgba(255,255,255,0.63) 5px,
          rgba(190,190,190,0.18) 6px,
          rgba(255,255,255,0.25) 11px
        );

      backdrop-filter:
        blur(11px);

      -webkit-backdrop-filter:
        blur(11px);

      border:
        1px solid
        rgba(255,255,255,0.55);

      box-shadow:
        0 5px 18px
        rgba(0,0,0,0.035);

      opacity: 0.82;

      pointer-events: none;
    }

    .glass-1 {
      width: 8.5%;
      height: 17%;

      left: 3%;
      top: 24%;

      transform: rotate(-7deg);
    }

    .glass-2 {
      width: 9%;
      height: 22%;

      left: 34%;
      top: 31%;

      transform: rotate(-5deg);
    }

    .glass-3 {
      width: 11%;
      height: 17%;

      right: 18%;
      top: 2%;

      transform: rotate(-3deg);
    }

    .glass-4 {
      width: 11%;
      height: 18%;

      right: 2%;
      bottom: 2%;

      transform: rotate(12deg);
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 850px) {

      .photography-page {
        padding:
          22px
          18px
          40px;
      }

      .top-nav {
        position: static;

        margin-top: 16px;

        justify-content: center;

        gap: 24px;
      }

      .collage {
        height: auto;
        min-height: 0;

        margin-top: 40px;

        display: grid;

        grid-template-columns:
          1fr 1fr;

        gap: 16px;
      }

      .photo-card {
        position: relative;

        inset: auto !important;

        width: 100% !important;
        height: 280px !important;

        transform:
          none !important;
      }

      .label,
      .arrow,
      .glass {
        display: none;
      }
    }

    @media (max-width: 580px) {

      .collage {
        grid-template-columns: 1fr;
      }

      .photo-card {
        height: 330px !important;
      }
    }

  </style>
</head>

<body>

  <main class="photography-page">

    <header class="site-header">

      <a

      >

      <svg

      <svg

      <!-- GLASS -->

      <div class="glass glass-1"></div>

    </section>

  </main>

</body>

</html>
