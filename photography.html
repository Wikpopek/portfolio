
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photography — wikivisual.co</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       GENERAL
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fbfaf8;
      color: #151515;
      font-family: "IBM Plex Mono", monospace;
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       PAGE
    ========================= */

    .photography-page {
      width: 100%;
      min-height: 100vh;
      padding: 22px 34px 26px;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }

    .logo {
      font-size: clamp(24px, 2vw, 38px);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
      color: #111;
    }

    .section-title {
      margin-top: 9px;
      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #777;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .top-nav {
      position: absolute;
      top: 1px;
      right: 0;

      display: flex;
      gap: 28px;
      z-index: 9999;

      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #555;
    }

    .top-nav a {
      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .top-nav a:hover {
      opacity: 0.5;
      transform: translateY(-1px);
    }

    /* =========================
       DESKTOP COLLAGE
    ========================= */

    .collage {
      position: relative;

      width: min(1500px, 96vw);
      height: min(760px, calc(100vh - 105px));
      min-height: 650px;

      margin: 10px auto 0;
    }

    .photo-card {
      position: absolute;
      display: block;

      padding: 0;
      border: none;
      background: transparent;

      cursor: pointer;
      z-index: 3;
      overflow: visible;

      transition:
        transform 0.5s cubic-bezier(.22,.61,.36,1),
        opacity 0.3s ease;
    }

    .photo-card:hover {
      z-index: 30;
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* =========================
       PORTRAIT
    ========================= */

    .portrait-card {
      width: 22%;
      left: 10%;
      top: 8%;
      transform: rotate(5deg);
    }

    .portrait-card:hover {
      transform: rotate(3deg) scale(1.012);
    }

    /* =========================
       COUPLES
    ========================= */

    .couples-card {
      width: 22%;
      left: 38%;
      top: 20%;
      transform: rotate(-2deg);
    }

    .couples-card:hover {
      transform: rotate(-1deg) scale(1.01);
    }

    /* =========================
       STUDIO
    ========================= */

    .studio-card {
      width: 19%;
      right: 10%;
      bottom: 4%;
      transform: rotate(-4deg);
    }

    .studio-card:hover {
      transform: rotate(-2deg) scale(1.012);
    }

    /* =========================
       LABELS
    ========================= */

    .label {
      position: absolute;
      z-index: 40;

      font-size: clamp(8px, 0.66vw, 11px);
      font-weight: 300;
      letter-spacing: 0.13em;
      text-transform: uppercase;

      white-space: nowrap;
      color: #333;
    }

    .portrait-label {
      left: 2%;
      top: 15%;
    }

    .couples-label {
      left: 29%;
      bottom: 12%;
    }

    .studio-label {
      right: 2%;
      bottom: 13%;
    }

    /* =========================
       ARROWS
    ========================= */

    .arrow {
      position: absolute;
      overflow: visible;
      z-index: 41;
      pointer-events: none;
    }

    .arrow path {
      fill: none;
      stroke: #393939;
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .portrait-arrow {
      left: 3.5%;
      top: 18%;
      width: 85px;
      height: 62px;
    }

    .couples-arrow {
      left: 31%;
      bottom: 15%;
      width: 105px;
      height: 80px;
    }

    .studio-arrow {
      right: 7%;
      bottom: 15%;
      width: 100px;
      height: 80px;
    }

    /* =========================
       GLASS EFFECTS
    ========================= */

    .glass {
      position: absolute;
      z-index: 15;

      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.63) 0,
          rgba(255,255,255,0.63) 5px,
          rgba(190,190,190,0.18) 6px,
          rgba(255,255,255,0.25) 11px
        );

      backdrop-filter: blur(11px);
      -webkit-backdrop-filter: blur(11px);

      opacity: 0.82;
      pointer-events: none;
    }

    .glass-1 {
      width: 9%;
      height: 18%;
      left: 4%;
      top: 31%;
      transform: rotate(-7deg);
    }

    .glass-2 {
      width: 9%;
      height: 18%;
      left: 55%;
      top: 26%;
      transform: rotate(-5deg);
    }

    .glass-4 {
      width: 8%;
      height: 15%;
      right: 23%;
      bottom: 5%;
      transform: rotate(-8deg);
    }

    /* =========================
       CATEGORY GALLERY MODAL
    ========================= */

    .gallery-modal {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 28px;

      background: rgba(242,239,234,0.86);

      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      z-index: 5000;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .gallery-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .gallery-panel {
      position: relative;

      width: min(1250px, 95vw);
      max-height: 92vh;

      overflow-y: auto;

      background: #fbfaf8;
      padding: 30px 24px;

      box-shadow:
        0 18px 55px rgba(0,0,0,0.13);
    }

    /* =========================
       GALLERY HEADER
    ========================= */

    .gallery-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 34px;
    }

    .gallery-logo {
      font-size: clamp(20px, 1.6vw, 30px);
      font-weight: 600;
      letter-spacing: -0.06em;
    }

    .gallery-title {
      margin-top: 9px;

      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;

      color: #777;
    }

    .close-gallery {
      position: absolute;
      top: 20px;
      right: 24px;

      border: none;
      background: transparent;

      font-size: 22px;
      color: #333;

      cursor: pointer;
      z-index: 10;
    }

    /* =========================
       COMBINED GALLERY
    ========================= */

    .category-gallery {
      width: 100%;
    }

    .portrait-grid {
      width: 100%;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gallery-row {
      width: 100%;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .portrait-item {
      flex: 0 0 auto;
      display: block;
      overflow: hidden;
      cursor: pointer;
    }

    .portrait-item img {
      width: 100%;
      height: 100%;

      display: block;
      object-fit: contain;
    }

    .gallery-empty {
      padding: 50px 10px;
      text-align: center;
      font-size: 11px;
      color: #777;
    }

    /* =========================
       LIGHTBOX
    ========================= */

    .lightbox {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(10,10,10,0.94);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      z-index: 99999;
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .lightbox-content {
      position: relative;

      width: min(1250px, 95vw);
      height: 94vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;
    }

    .lightbox-main {
      max-width: 82vw;
      max-height: 76vh;

      width: auto;
      height: auto;

      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 8px;
      right: 8px;

      border: none;
      background: transparent;

      color: #fff;
      font-size: 27px;

      cursor: pointer;
    }

    .lightbox-arrow {
      position: absolute;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #fff;
      font-size: 46px;

      cursor: pointer;
      opacity: 0.7;
    }

    .lightbox-prev {
      left: 14px;
    }

    .lightbox-next {
      right: 14px;
    }

    .lightbox-thumbs {
      display: flex;
      gap: 7px;

      margin-top: 17px;
      max-width: 92vw;

      overflow-x: auto;
    }

    .lightbox-thumbs img {
      flex: 0 0 auto;

      width: 48px;
      height: 62px;

      object-fit: cover;
      opacity: 0.4;
      cursor: pointer;
    }

    .lightbox-thumbs img.active {
      opacity: 1;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .photography-page {
        padding: 20px 16px 60px;
      }

      .site-header {
        align-items: flex-start;
      }

      .logo {
        font-size: 28px;
      }

      .section-title {
        margin-top: 8px;
        font-size: 9px;
      }

      .top-nav {
        position: static;
        width: 100%;

        margin-top: 20px;

        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 16px;

        font-size: 9px;
      }

      .collage {
        position: relative;

        width: 100%;
        height: auto;
        min-height: 0;

        margin: 44px auto 0;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 92px;
      }

      .photo-card,
      .portrait-card,
      .couples-card,
      .studio-card {
        position: relative !important;

        inset: auto !important;

        width: min(360px, 88vw) !important;
        height: auto !important;

        display: block;
        padding: 0;
        border: none;

        background: transparent;
        transform: none !important;
        overflow: visible;

        z-index: 10;
      }

      .photo-card img {
        position: relative;
        z-index: 1;

        width: 100%;
        height: auto;

        display: block;
        object-fit: contain;
        object-position: center;
      }

      /* MOBILE PLASTIC */

      .photo-card::before {
        content: "";

        position: absolute;
        z-index: 5;

        width: 118px;
        height: 132px;
        bottom: -40px;

        pointer-events: none;

        background:
          repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.72) 0,
            rgba(255,255,255,0.72) 8px,
            rgba(185,185,185,0.23) 9px,
            rgba(255,255,255,0.30) 17px
          );

        backdrop-filter: blur(13px);
        -webkit-backdrop-filter: blur(13px);

        opacity: 0.88;
      }

      .portrait-card::before {
        left: 7%;
        transform: rotate(-7deg);
      }

      .couples-card::before {
        right: 7%;
        transform: rotate(7deg);
      }

      .studio-card::before {
        right: 11%;
        transform: rotate(6deg);
      }

      /* MOBILE TITLES */

      .photo-card::after {
        position: relative;
        z-index: 8;

        display: block;
        margin-top: 32px;
        text-align: center;

        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.16em;
        text-transform: uppercase;

        color: #222;
      }

      .portrait-card::after {
        content: "Portrait";
      }

      .couples-card::after {
        content: "Couples";
      }

      .studio-card::after {
        content: "Studio";
      }

      .label,
      .arrow,
      .collage > .glass {
        display: none;
      }

      .gallery-modal {
        padding: 12px;
      }

      .gallery-panel {
        width: 100%;
        max-height: 94vh;
        padding: 26px 14px 22px;
      }

      .lightbox-main {
        max-width: 88vw;
        max-height: 70vh;
      }

    }

    /* =========================
       SMALL PHONE
    ========================= */

    @media (max-width: 520px) {

      .photography-page {
        padding: 18px 14px 55px;
      }

      .logo {
        font-size: 25px;
      }

      .top-nav {
        gap: 14px;
        font-size: 8px;
      }

      .collage {
        margin-top: 38px;
        gap: 84px;
      }

      .photo-card,
      .portrait-card,
      .couples-card,
      .studio-card {
        width: min(330px, 92vw) !important;
      }

      .photo-card::before {
        width: 100px;
        height: 116px;
        bottom: -36px;
      }

      .portrait-card::before {
        left: 5%;
      }

      .couples-card::before {
        right: 5%;
      }

      .studio-card::before {
        right: 8%;
      }

      .photo-card::after {
        margin-top: 28px;
        font-size: 9px;
      }

      .gallery-modal {
        padding: 8px;
      }

      .gallery-panel {
        width: 100%;
        max-height: 95vh;
        padding: 24px 10px 20px;
      }

      .lightbox-main {
        max-width: 90vw;
        max-height: 68vh;
      }

      .lightbox-arrow {
        font-size: 35px;
      }

      .lightbox-prev {
        left: 2px;
      }

      .lightbox-next {
        right: 2px;
      }

    }

  </style>
</head>

<body>

  <main class="photography-page">

    <!-- HEADER -->

    <header class="site-header">

      <a href="index.html" class="logo">
        wikivisual.co
      </a>

      <div class="section-title">
        Photography
      </div>

      <nav class="top-nav">

        <a href="digital-design.html">
          Digital Design
        </a>

        <a href="about.html">
          About Me
        </a>

        <a href="contact.html">
          Contact
        </a>

      </nav>

    </header>

    <!-- =========================
         COLLAGE
    ========================= -->

    <section class="collage">

      <!-- PORTRAIT -->

      <button
        class="photo-card portrait-card"
        id="openPortraits"
        type="button"
        aria-label="Open Portrait gallery"
      >

        <img
          src="images/monika/monika-01.JPG"
          alt="Portrait photography"
        >

      </button>

      <!-- COUPLES -->

      <button
        class="photo-card couples-card"
        id="openCouples"
        type="button"
        aria-label="Open Couples gallery"
      >

        <img
          src="images/gabi-konrad/gabi-konrad-01.jpeg"
          alt="Couples photography"
        >

      </button>

      <!-- STUDIO -->

      <button
        class="photo-card studio-card"
        id="openStudio"
        type="button"
        aria-label="Open Studio gallery"
      >

        <img
          src="images/daniela-studio/daniela-studio-01.jpg"
          alt="Studio photography"
        >

      </button>

      <!-- =========================
           LABELS
      ========================= -->

      <div class="label portrait-label">
        Portrait
      </div>

      <div class="label couples-label">
        Couples
      </div>

      <div class="label studio-label">
        Studio
      </div>

      <!-- =========================
           ARROWS
      ========================= -->

      <svg
        class="arrow portrait-arrow"
        viewBox="0 0 85 62"
      >
        <path d="M 4 4 C 10 25, 27 42, 63 47"/>
        <path d="M 55 40 L 64 47 L 54 52"/>
      </svg>

      <svg
        class="arrow couples-arrow"
        viewBox="0 0 105 80"
      >
        <path d="M 5 70 C 26 62, 48 46, 78 18"/>
        <path d="M 66 21 L 80 16 L 76 31"/>
      </svg>

      <svg
        class="arrow studio-arrow"
        viewBox="0 0 100 80"
      >
        <path d="M 95 68 C 74 60, 55 44, 34 22"/>
        <path d="M 45 26 L 32 20 L 36 34"/>
      </svg>

      <!-- =========================
           GLASS
      ========================= -->

      <div class="glass glass-1"></div>
      <div class="glass glass-2"></div>
      <div class="glass glass-4"></div>

    </section>

  </main>

  <!-- =========================
       CATEGORY MODAL
  ========================= -->

  <div
    class="gallery-modal"
    id="galleryModal"
    role="dialog"
    aria-modal="true"
    aria-label="Photography gallery"
  >

    <div class="gallery-panel" id="galleryPanel">

      <button
        class="close-gallery"
        id="closeGallery"
        type="button"
        aria-label="Close gallery"
      >
        ×
      </button>

      <div class="gallery-top">

        <div class="gallery-logo">
          wikivisual.co
        </div>

        <div
          class="gallery-title"
          id="categoryTitle"
        >
          Photography
        </div>

      </div>

      <!-- COMBINED PHOTO GALLERY -->

      <div class="category-gallery">

        <div
          class="portrait-grid"
          id="portraitGrid"
        ></div>

      </div>

    </div>

  </div>

  <!-- =========================
       LIGHTBOX
  ========================= -->

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Full-size photograph"
  >

    <div class="lightbox-content">

      <button
        class="lightbox-close"
        id="closeLightbox"
        type="button"
        aria-label="Close image"
      >
        ×
      </button>

      <button
        class="lightbox-arrow lightbox-prev"
        id="prevImage"
        type="button"
        aria-label="Previous image"
      >
        ‹
      </button>

      <img
        src=""
        alt="Selected photograph"
        class="lightbox-main"
        id="lightboxMain"
      >

      <button
        class="lightbox-arrow lightbox-next"
        id="nextImage"
        type="button"
        aria-label="Next image"
      >
        ›
      </button>

      <div
        class="lightbox-thumbs"
        id="lightboxThumbs"
      ></div>

    </div>

  </div>

  <script>

    /* =========================
       PHOTO PATH HELPER
    ========================= */

    function numberedPhotos(
      folder,
      prefix,
      start,
      end,
      extension
    ) {

      const result = [];

      for (
        let number = start;
        number <= end;
        number++
      ) {

        const formattedNumber =
          String(number).padStart(2, "0");

        result.push(
          `images/${folder}/${prefix}-${formattedNumber}.${extension}`
        );

      }

      return result;

    }

    /* =========================
       PORTRAIT PHOTOS

       Monika
       Karla
       Daniela
       Kacper
    ========================= */

    const portraitPhotos = [

      "images/monika/monika-01.JPG",

      ...numberedPhotos(
        "monika", "monika", 19, 22, "jpg"
      ),

      ...numberedPhotos(
        "monika", "monika", 2, 7, "jpg"
      ),

      ...numberedPhotos(
        "monika", "monika", 8, 18, "jpeg"
      ),

      ...numberedPhotos(
        "karla", "karla", 1, 10, "jpg"
      ),

      ...numberedPhotos(
        "daniela", "daniela", 1, 12, "jpg"
      ),

      ...numberedPhotos(
        "kacper", "kacper", 1, 4, "jpg"
      )

    ];

    /* =========================
       COUPLES PHOTOS

       Gabi & Konrad
       Shannon & Anthony
    ========================= */

    const couplesPhotos = [

      ...numberedPhotos(
        "gabi-konrad",
        "gabi-konrad",
        1,
        14,
        "jpeg"
      ),

      "images/gabi-konrad/gabi-konrad-21.jpeg",

      ...numberedPhotos(
        "shannon-anthony",
        "shannon-anthony",
        1,
        5,
        "jpg"
      ),

      ...numberedPhotos(
        "shannon-anthony",
        "shannon-anthony",
        7,
        12,
        "jpg"
      )

    ];

    /* =========================
       STUDIO PHOTOS
    ========================= */

    const studioPhotos = [

      ...numberedPhotos(
        "daniela-studio",
        "daniela-studio",
        1,
        9,
        "jpg"
      )

    ];

    /* =========================
       CATEGORIES

       Travel removed.
    ========================= */

    const categories = {

      portraits: {
        title: "Portrait",
        images: portraitPhotos
      },

      couples: {
        title: "Couples",
        images: couplesPhotos
      },

      studio: {
        title: "Studio",
        images: studioPhotos
      }

    };

    /* =========================
       ELEMENTS
    ========================= */

    const galleryModal =
      document.getElementById("galleryModal");

    const galleryPanel =
      document.getElementById("galleryPanel");

    const closeGallery =
      document.getElementById("closeGallery");

    const categoryTitle =
      document.getElementById("categoryTitle");

    const portraitGrid =
      document.getElementById("portraitGrid");

    const lightbox =
      document.getElementById("lightbox");

    const lightboxMain =
      document.getElementById("lightboxMain");

    const lightboxThumbs =
      document.getElementById("lightboxThumbs");

    const closeLightbox =
      document.getElementById("closeLightbox");

    const prevImage =
      document.getElementById("prevImage");

    const nextImage =
      document.getElementById("nextImage");

    /* =========================
       STATE
    ========================= */

    let currentGallery = [];
    let currentImageIndex = 0;

    let currentCategory = "";
    let renderVersion = 0;
    let lastTrigger = null;

    /* =========================
       OPEN CATEGORY
    ========================= */

    async function openCategory(categoryKey) {

      const category =
        categories[categoryKey];

      if (!category) return;

      currentCategory = categoryKey;

      currentGallery = [
        ...category.images
      ];

      categoryTitle.textContent =
        category.title;

      galleryModal.classList.add(
        "active"
      );

      document.body.classList.add(
        "modal-open"
      );

      galleryPanel.scrollTop = 0;

      await renderCombinedGallery();

    }

    /* =========================
       CATEGORY BUTTONS
    ========================= */

    document
      .getElementById("openPortraits")
      .addEventListener("click", function() {

        lastTrigger = this;
        openCategory("portraits");

      });

    document
      .getElementById("openCouples")
      .addEventListener("click", function() {

        lastTrigger = this;
        openCategory("couples");

      });

    document
      .getElementById("openStudio")
      .addEventListener("click", function() {

        lastTrigger = this;
        openCategory("studio");

      });

    /* =========================
       CLOSE CATEGORY
    ========================= */

    function closeCategoryModal() {

      renderVersion++;

      galleryModal.classList.remove(
        "active"
      );

      document.body.classList.remove(
        "modal-open"
      );

      portraitGrid.innerHTML = "";

      if (lastTrigger) {
        lastTrigger.focus();
      }

    }

    closeGallery.addEventListener(
      "click",
      closeCategoryModal
    );

    galleryModal.addEventListener(
      "click",
      function(event) {

        if (event.target === galleryModal) {
          closeCategoryModal();
        }

      }
    );

    /* =========================
       IMAGE INFORMATION
    ========================= */

    function getImageInfo(src, index) {

      return new Promise(resolve => {

        const image = new Image();

        image.onload = function() {

          resolve({
            src: src,
            index: index,
            ratio:
              image.naturalWidth /
              image.naturalHeight
          });

        };

        image.onerror = function() {

          resolve({
            src: src,
            index: index,
            ratio: 1
          });

        };

        image.src = src;

      });

    }

    /* =========================
       JUSTIFIED ROWS
    ========================= */

    function createJustifiedRow(
      photos,
      galleryWidth,
      gap,
      targetHeight,
      isLastRow = false
    ) {

      if (photos.length === 0) return;

      const row =
        document.createElement("div");

      row.className = "gallery-row";

      const totalRatio =
        photos.reduce(
          (sum, photo) =>
            sum + photo.ratio,
          0
        );

      const totalGap =
        gap * (photos.length - 1);

      const availableWidth =
        Math.max(
          1,
          galleryWidth - totalGap
        );

      let rowHeight =
        availableWidth / totalRatio;

      if (isLastRow) {

        rowHeight = Math.min(
          rowHeight,
          targetHeight
        );

      }

      rowHeight = Math.min(
        rowHeight,
        targetHeight * 1.65
      );

      photos.forEach(photo => {

        const item =
          document.createElement("div");

        item.className = "portrait-item";

        item.style.width =
          `${rowHeight * photo.ratio}px`;

        item.style.height =
          `${rowHeight}px`;

        const img =
          document.createElement("img");

        img.src = photo.src;

        img.alt =
          "Photography portfolio image";

        img.loading = "lazy";

        img.addEventListener(
          "click",
          function() {

            openLightbox(photo.index);

          }
        );

        item.appendChild(img);
        row.appendChild(item);

      });

      portraitGrid.appendChild(row);

    }

    /* =========================
       RENDER COMBINED GALLERY
    ========================= */

    async function renderCombinedGallery() {

      const version = ++renderVersion;

      portraitGrid.innerHTML = "";

      if (currentGallery.length === 0) {

        portraitGrid.innerHTML =
          '<div class="gallery-empty">No images available.</div>';

        return;

      }

      await new Promise(resolve => {
        requestAnimationFrame(resolve);
      });

      const photos = [
        ...currentGallery
      ];

      const imageData =
        await Promise.all(

          photos.map(
            (src, index) =>
              getImageInfo(src, index)
          )

        );

      if (
        version !== renderVersion ||
        !galleryModal.classList.contains(
          "active"
        )
      ) {
        return;
      }

      portraitGrid.innerHTML = "";

      const galleryWidth =
        portraitGrid.clientWidth;

      if (galleryWidth <= 0) return;

      let targetHeight = 255;

      if (window.innerWidth < 850) {
        targetHeight = 210;
      }

      if (window.innerWidth < 580) {
        targetHeight = 165;
      }

      const gap = 10;

      let row = [];
      let ratio = 0;

      imageData.forEach(photo => {

        row.push(photo);

        ratio += photo.ratio;

        const estimatedWidth =
          ratio * targetHeight +
          gap * (row.length - 1);

        if (
          estimatedWidth >= galleryWidth
        ) {

          createJustifiedRow(
            row,
            galleryWidth,
            gap,
            targetHeight,
            false
          );

          row = [];
          ratio = 0;

        }

      });

      if (row.length > 0) {

        createJustifiedRow(
          row,
          galleryWidth,
          gap,
          targetHeight,
          true
        );

      }

    }

    /* =========================
       RESPONSIVE GALLERY
    ========================= */

    let resizeFrame = null;

    window.addEventListener(
      "resize",
      function() {

        if (
          !galleryModal.classList.contains(
            "active"
          )
        ) {
          return;
        }

        if (resizeFrame !== null) {
          cancelAnimationFrame(resizeFrame);
        }

        resizeFrame =
          requestAnimationFrame(function() {

            resizeFrame = null;

            renderCombinedGallery();

          });

      }
    );

    /* =========================
       LIGHTBOX
    ========================= */

    function openLightbox(index) {

      if (!currentGallery.length) return;

      currentImageIndex = index;

      createThumbnails();
      updateLightbox();

      lightbox.classList.add(
        "active"
      );

    }

    function updateLightbox() {

      lightboxMain.src =
        currentGallery[
          currentImageIndex
        ];

      const thumbs =
        lightboxThumbs.querySelectorAll(
          "img"
        );

      thumbs.forEach(
        (thumb, index) => {

          thumb.classList.toggle(
            "active",
            index === currentImageIndex
          );

        }
      );

      const activeThumb =
        thumbs[currentImageIndex];

      if (activeThumb) {

        activeThumb.scrollIntoView({
          behavior: "smooth",
          block: "nearest",
          inline: "nearest"
        });

      }

    }

    /* =========================
       THUMBNAILS
    ========================= */

    function createThumbnails() {

      lightboxThumbs.innerHTML = "";

      currentGallery.forEach(
        (src, index) => {

          const img =
            document.createElement(
              "img"
            );

          img.src = src;

          img.alt =
            `Photograph ${index + 1}`;

          img.loading = "lazy";

          img.addEventListener(
            "click",
            function() {

              currentImageIndex = index;

              updateLightbox();

            }
          );

          lightboxThumbs.appendChild(
            img
          );

        }
      );

    }

    /* =========================
       NEXT / PREVIOUS
    ========================= */

    nextImage.addEventListener(
      "click",
      function() {

        if (!currentGallery.length) return;

        currentImageIndex =
          (currentImageIndex + 1) %
          currentGallery.length;

        updateLightbox();

      }
    );

    prevImage.addEventListener(
      "click",
      function() {

        if (!currentGallery.length) return;

        currentImageIndex =
          (
            currentImageIndex - 1 +
            currentGallery.length
          ) % currentGallery.length;

        updateLightbox();

      }
    );

    /* =========================
       CLOSE LIGHTBOX
    ========================= */

    function closeImageLightbox() {

      lightbox.classList.remove(
        "active"
      );

    }

    closeLightbox.addEventListener(
      "click",
      closeImageLightbox
    );

    lightbox.addEventListener(
      "click",
      function(event) {

        if (event.target === lightbox) {
          closeImageLightbox();
        }

      }
    );

    /* =========================
       KEYBOARD CONTROLS
    ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          lightbox.classList.contains(
            "active"
          )
        ) {

          if (event.key === "ArrowLeft") {

            event.preventDefault();
            prevImage.click();

          }

          if (event.key === "ArrowRight") {

            event.preventDefault();
            nextImage.click();

          }

          if (event.key === "Escape") {

            closeImageLightbox();

          }

          return;

        }

        if (
          event.key === "Escape" &&
          galleryModal.classList.contains(
            "active"
          )
        ) {

          closeCategoryModal();

        }

      }
    );

  </script>

</body>
</html>
