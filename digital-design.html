<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Digital Design — wikivisual.co</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #fbfaf8;
      color: #151515;
      font-family: "IBM Plex Mono", monospace;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .design-page {
      width: 100%;
      min-height: 100vh;
      padding: 22px 30px 28px;
    }

    /* HEADER */

    .site-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }

    .logo {
      font-size: clamp(24px, 2vw, 38px);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
      color: #111;
    }

    .section-title {
      margin-top: 9px;
      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #777;
    }

    .top-nav {
      position: absolute;
      top: 1px;
      right: 0;
      display: flex;
      align-items: center;
      gap: 28px;
      z-index: 9999;
      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #555;
    }

    .top-nav a {
      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .top-nav a:hover {
      opacity: 0.55;
      transform: translateY(-1px);
    }

    /* COLLAGE */

    .collage {
      position: relative;
      width: min(1280px, 90vw);
      height: 800px;
      margin: 8px auto 0;
      overflow: visible;
    }

    /* PROJECTS */

    .project {
      position: absolute;
      display: block;
      z-index: 5;
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .project:hover {
      z-index: 40;
    }

    .project img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
      background: transparent;
      user-select: none;
      -webkit-user-drag: none;
    }

    .amazon {
      width: 39%;
      height: 40%;
      left: 9%;
      top: 4%;
      transform: rotate(4deg);
    }

    .amazon:hover {
      transform: rotate(2deg) scale(1.02);
    }

    .sentrix {
      width: 38%;
      height: 55%;
      right: 4%;
      top: 0%;
      transform: rotate(3deg);
    }

    .sentrix:hover {
      transform: rotate(1deg) scale(1.02);
    }

    .mycunyevent {
      width: 37%;
      height: 54%;
      left: 31%;
      top: 22%;
      transform: rotate(-1deg);
      z-index: 10;
    }

    .mycunyevent:hover {
      transform: rotate(0deg) scale(1.02);
    }

    .glowr {
      width: 43%;
      height: 45%;
      left: 2%;
      bottom: 7%;
      transform: rotate(-3deg);
    }

    .glowr:hover {
      transform: rotate(-1deg) scale(1.02);
    }

    .prelude {
      width: 29%;
      height: 31%;
      right: 10%;
      bottom: 12%;
      transform: rotate(-3deg);
    }

    .prelude:hover {
      transform: rotate(-1deg) scale(1.02);
    }

    /* ANNOTATIONS */

    .annotation {
      position: absolute;
      z-index: 60;
      pointer-events: none;
    }

    .annotation-text {
      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #333;
    }

    .annotation svg {
      display: block;
      overflow: visible;
    }

    .annotation path {
      fill: none;
      stroke: #333;
      stroke-width: 1.05;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .annotation-amazon {
      left: 1%;
      top: 13%;
    }

    .annotation-amazon svg {
      width: 90px;
      height: 65px;
      margin-top: 5px;
      margin-left: 20px;
    }

    .annotation-sentrix {
      right: 0%;
      top: 10%;
      text-align: right;
    }

    .annotation-sentrix svg {
      width: 90px;
      height: 65px;
      margin-top: 5px;
      margin-left: auto;
      margin-right: 16px;
    }

    .annotation-glowr {
      left: 1%;
      bottom: 25%;
    }

    .annotation-glowr svg {
      width: 88px;
      height: 60px;
      margin-top: 4px;
      margin-left: 18px;
    }

    .annotation-mycuny {
      left: 53.5%;
      bottom: 14%;
      text-align: center;
    }

    .annotation-mycuny svg {
      width: 92px;
      height: 72px;
      display: block;
      margin: 0 auto 2px;
    }

    .annotation-prelude {
      right: 1%;
      bottom: 35%;
      text-align: right;
    }

    .annotation-prelude svg {
      width: 82px;
      height: 60px;
      margin-top: 5px;
      margin-left: auto;
      margin-right: 12px;
    }

    /* GLASS */

    .glass {
      position: absolute;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.48),
          rgba(255,255,255,0.14)
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.76) 0px,
          rgba(255,255,255,0.76) 4px,
          rgba(210,210,210,0.16) 5px,
          rgba(255,255,255,0.30) 8px,
          rgba(170,170,170,0.10) 9px,
          rgba(255,255,255,0.60) 12px
        );

      backdrop-filter: blur(14px) saturate(0.88);
      -webkit-backdrop-filter: blur(14px) saturate(0.88);

      opacity: 0.86;
      pointer-events: none;
      z-index: 20;
    }

    .glass-1 {
      width: 11%;
      height: 22%;
      left: 5%;
      top: 28%;
      transform: rotate(-5deg);
    }

    .glass-2 {
      width: 15%;
      height: 13%;
      left: 41.5%;
      bottom: 11%;
      transform: rotate(3deg);
    }

    .glass-3 {
      width: 11%;
      height: 24%;
      right: 11%;
      top: 15%;
      transform: rotate(4deg);
      z-index: 2;
    }

    .glass-4 {
      width: 14%;
      height: 17%;
      left: 7%;
      bottom: 5%;
      transform: rotate(-4deg);
    }

    .glass-5 {
      width: 18%;
      height: 16%;
      right: 3%;
      bottom: 3%;
      transform: rotate(4deg);
    }

    /* BOTTOM MARK */

    .design-mark {
      position: absolute;
      left: 1%;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 17px;
      z-index: 50;
      font-size: 8px;
      font-weight: 300;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #999;
    }

    .design-mark-line {
      width: 30px;
      height: 1px;
      background: #999;
    }

    /* PROJECT OVERLAY */

    body.project-open {
      overflow: hidden;
    }

    .project-overlay {
      position: fixed;
      inset: 0;
      z-index: 20000;

      display: none;

      width: 100%;
      height: 100vh;

      background: #fbfaf8;

      overflow-y: auto;
      overflow-x: hidden;
    }

    .project-overlay.is-open {
      display: block;
    }

    .project-close {
      position: fixed;
      top: 24px;
      right: 30px;

      z-index: 20002;

      width: 44px;
      height: 44px;

      border: none;
      background: transparent;

      color: #151515;

      font-family: "IBM Plex Mono", monospace;
      font-size: 30px;
      font-weight: 300;

      cursor: pointer;
    }

    .project-close:hover {
      opacity: 0.55;
    }

    .project-view {
      width: 100%;
      min-height: 100vh;

      padding: 72px 28px 40px;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .project-image-wrap {
      position: relative;

      width: 100%;
      max-width: 1600px;

      margin: 0 auto;
    }

    .project-image-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* TEST LINKS */

    .test-link {
      position: absolute;

      left: 50%;
      transform: translateX(-50%);

      z-index: 500;

      display: inline-block;

      font-size: 52px;
      font-weight: 600;
      letter-spacing: 0.06em;
      line-height: 1;

      text-transform: uppercase;
      color: #000;

      border-bottom: 6px solid #000;
      padding-bottom: 6px;

      background: transparent;

      cursor: pointer;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .test-link:hover {
      opacity: 0.55;

      transform:
        translateX(-50%)
        translateY(-2px);
    }

    /* MY CUNY EVENT */

    .mycuny-test-link {
      top: 65%;
    }

    /* GLOWR */

    .glowr-test-link {
      top: 79%;
    }

    /* MOBILE */

    @media (max-width: 850px) {

      .design-page {
        padding: 22px 18px 40px;
      }

      .top-nav {
        position: static;
        margin-top: 16px;
        justify-content: center;
        flex-wrap: wrap;
        gap: 22px;
      }

      .collage {
        width: 100%;
        height: auto;
        margin-top: 40px;

        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
      }

      .project {
        position: relative;
        inset: auto !important;

        width: 100% !important;
        height: 340px !important;

        transform: none !important;
      }

      .annotation,
      .glass,
      .design-mark {
        display: none;
      }

      .project-view {
        padding: 68px 12px 24px;
      }

      .project-image-wrap {
        width: 100%;
        max-width: 100%;
      }

      .project-close {
        top: 14px;
        right: 14px;
      }

      .test-link {
        font-size: 30px;
        border-bottom: 4px solid #000;
        padding-bottom: 4px;
      }

      .mycuny-test-link {
        top: 65%;
      }

      .glowr-test-link {
        top: 79%;
      }
    }

    @media (max-width: 580px) {

      .collage {
        grid-template-columns: 1fr;
      }

      .project {
        height: 360px !important;
      }

      .test-link {
        font-size: 22px;
        border-bottom: 3px solid #000;
      }
    }

  </style>
</head>

<body>

  <main class="design-page">

    <header class="site-header">

      <a href="index.html" class="logo">
        wikivisual.co
      </a>

      <div class="section-title">
        Digital Design
      </div>

      <nav class="top-nav">
        <a href="photography.html">Photography</a>
        <a href="about.html">About Me</a>
        <a href="contact.html">Contact</a>
      </nav>

    </header>

    <section class="collage">

      <a href="#" class="project amazon" data-project="amazon-project">
        <img
          src="images/digital-design/amazon.png"
          alt="Student Amazon Prime"
        />
      </a>

      <a href="#" class="project sentrix" data-project="sentrix-project">
        <img
          src="images/digital-design/sentrix.png"
          alt="Sentrix"
        />
      </a>

      <a
        href="#"
        class="project mycunyevent"
        data-project="mycunyevent-project"
      >
        <img
          src="images/digital-design/mycunyevent.png"
          alt="myCUNYevent"
        />
      </a>

      <a href="#" class="project glowr" data-project="glowr-project">
        <img
          src="images/digital-design/glowr.png"
          alt="Glowr"
        />
      </a>

      <a href="#" class="project prelude" data-project="prelude-project">
        <img
          src="images/digital-design/prelude.png"
          alt="Prelude"
        />
      </a>

      <div class="annotation annotation-amazon">

        <div class="annotation-text">
          Student Amazon Prime
        </div>

        <svg viewBox="0 0 90 65">
          <path d="M 6 5 C 12 24, 30 40, 62 47" />
          <path d="M 53 40 L 65 48 L 52 54" />
        </svg>

      </div>

      <div class="annotation annotation-sentrix">

        <div class="annotation-text">
          Sentrix
        </div>

        <svg viewBox="0 0 90 65">
          <path d="M 84 5 C 78 24, 64 39, 39 47" />
          <path d="M 48 39 L 37 48 L 51 49" />
        </svg>

      </div>

      <div class="annotation annotation-glowr">

        <div class="annotation-text">
          Glowr
        </div>

        <svg viewBox="0 0 88 60">
          <path d="M 5 5 C 12 24, 28 38, 59 44" />
          <path d="M 50 37 L 62 45 L 49 51" />
        </svg>

      </div>

      <div class="annotation annotation-mycuny">

        <svg viewBox="0 0 92 72">
          <path d="M 79 65 C 68 52, 58 39, 40 23" />
          <path d="M 51 27 L 38 20 L 42 35" />
        </svg>

        <div class="annotation-text">
          mycunyevent
        </div>

      </div>

      <div class="annotation annotation-prelude">

        <div class="annotation-text">
          Prelude
        </div>

        <svg viewBox="0 0 82 60">
          <path d="M 77 5 C 73 23, 61 37, 39 45" />
          <path d="M 48 37 L 37 46 L 51 47" />
        </svg>

      </div>

      <div class="glass glass-1"></div>
      <div class="glass glass-2"></div>
      <div class="glass glass-3"></div>
      <div class="glass glass-4"></div>
      <div class="glass glass-5"></div>

      <div class="design-mark">
        <div class="design-mark-line"></div>
        <span>Digital Design</span>
      </div>

    </section>

  </main>

  <!-- AMAZON -->

  <section class="project-overlay" id="amazon-project">

    <button class="project-close" type="button">
      ×
    </button>

    <div class="project-view">

      <div class="project-image-wrap">

        <img
          src="images/digital-design/amazon-project.png"
          alt="Amazon project"
        />

      </div>

    </div>

  </section>

  <!-- SENTRIX -->

  <section class="project-overlay" id="sentrix-project">

    <button class="project-close" type="button">
      ×
    </button>

    <div class="project-view">

      <div class="project-image-wrap">

        <img
          src="images/digital-design/sentrix-project.png"
          alt="Sentrix project"
        />

      </div>

    </div>

  </section>

  <!-- MY CUNY EVENT -->

  <section class="project-overlay" id="mycunyevent-project">

    <button class="project-close" type="button">
      ×
    </button>

    <div class="project-view">

      <div class="project-image-wrap">

        <img
          src="images/digital-design/mycunyevent-project.png"
          alt="myCUNYevent project"
        />

        <a
          class="test-link mycuny-test-link"
          href="https://www.figma.com/proto/CUJ5Ha4LzIp4fa2fnLKCdf/Prototype?node-id=7-12&t=e3IU8UQCXpi0z9qL-0&scaling=scale-down&content-scaling=fixed&page-id=0%3A1&starting-point-node-id=7%3A12"
          target="_blank"
          rel="noopener noreferrer"
        >
          TEST
        </a>

      </div>

    </div>

  </section>

  <!-- GLOWR -->

  <section class="project-overlay" id="glowr-project">

    <button class="project-close" type="button">
      ×
    </button>

    <div class="project-view">

      <div class="project-image-wrap">

        <img
          src="images/digital-design/glowr-project.png"
          alt="Glowr project"
        />

        <a
          class="test-link glowr-test-link"
          href="https://www.figma.com/proto/WmrODy13DxAA6ea96hJA5m/Untitled?node-id=194-10&t=7vDVXG4LVbQJmouJ-0&scaling=scale-down&content-scaling=fixed&page-id=20%3A43&starting-point-node-id=194%3A232"
          target="_blank"
          rel="noopener noreferrer"
        >
          TEST
        </a>

      </div>

    </div>

  </section>

  <!-- PRELUDE -->

  <section class="project-overlay" id="prelude-project">

    <button class="project-close" type="button">
      ×
    </button>

    <div class="project-view">

      <div class="project-image-wrap">

        <img
          src="images/digital-design/prelude-project.png"
          alt="Prelude project"
        />

      </div>

    </div>

  </section>

  <script>

    const projectTriggers =
      document.querySelectorAll("[data-project]");

    const projectOverlays =
      document.querySelectorAll(".project-overlay");

    const closeButtons =
      document.querySelectorAll(".project-close");


    function openProject(projectId) {

      const overlay =
        document.getElementById(projectId);

      if (!overlay) return;

      overlay.classList.add("is-open");

      document.body.classList.add(
        "project-open"
      );

      overlay.scrollTop = 0;
    }


    function closeProject(overlay) {

      if (!overlay) return;

      overlay.classList.remove("is-open");

      document.body.classList.remove(
        "project-open"
      );
    }


    projectTriggers.forEach(
      function(trigger) {

        trigger.addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            const projectId =
              trigger.dataset.project;

            openProject(projectId);

          }
        );

      }
    );


    closeButtons.forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            const overlay =
              button.closest(".project-overlay");

            closeProject(overlay);

          }
        );

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          projectOverlays.forEach(
            function(overlay) {

              if (
                overlay.classList.contains(
                  "is-open"
                )
              ) {

                closeProject(overlay);

              }

            }
          );

        }

      }
    );

  </script>

</body>
