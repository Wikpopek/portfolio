<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Digital Design — wikivisual.co</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #fbfaf8;
      color: #151515;
      font-family: "IBM Plex Mono", monospace;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .design-page {
      width: 100%;
      min-height: 100vh;
      padding: 22px 30px 28px;
    }

    /* HEADER */

    .site-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }

    .logo {
      font-size: clamp(24px, 2vw, 38px);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
      color: #111;
    }

    .section-title {
      margin-top: 9px;
      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #777;
    }

    .top-nav {
      position: absolute;
      top: 1px;
      right: 0;
      display: flex;
      align-items: center;
      gap: 28px;
      z-index: 9999;
      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #555;
    }

    .top-nav a {
      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .top-nav a:hover {
      opacity: 0.55;
      transform: translateY(-1px);
    }

    /* COLLAGE */

    .collage {
      position: relative;
      width: min(1280px, 90vw);
      height: 800px;
      margin: 8px auto 0;
      overflow: visible;
    }

    /* PROJECTS */

    .project {
      position: absolute;
      display: block;
      z-index: 5;
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .project:hover {
      z-index: 40;
    }

    .project img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
      background: transparent;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* AMAZON */

    .amazon {
      width: 39%;
      height: 40%;
      left: 9%;
      top: 4%;
      transform: rotate(4deg);
    }

    .amazon:hover {
      transform: rotate(2deg) scale(1.02);
    }

    /* SENTRIX */

    .sentrix {
      width: 38%;
      height: 55%;
      right: 4%;
      top: 0%;
      transform: rotate(3deg);
    }

    .sentrix:hover {
      transform: rotate(1deg) scale(1.02);
    }

    /* MY CUNY EVENT */

    .mycunyevent {
      width: 37%;
      height: 54%;
      left: 31%;
      top: 22%;
      transform: rotate(-1deg);
      z-index: 10;
    }

    .mycunyevent:hover {
      transform: rotate(0deg) scale(1.02);
    }

    /* GLOWR */

    .glowr {
      width: 43%;
      height: 45%;
      left: 2%;
      bottom: 7%;
      transform: rotate(-3deg);
    }

    .glowr:hover {
      transform: rotate(-1deg) scale(1.02);
    }

    /* PRELUDE */

    .prelude {
      width: 29%;
      height: 31%;
      right: 10%;
      bottom: 12%;
      transform: rotate(-3deg);
    }

    .prelude:hover {
      transform: rotate(-1deg) scale(1.02);
    }

    /* ANNOTATIONS */

    .annotation {
      position: absolute;
      z-index: 60;
      pointer-events: none;
    }

    .annotation-text {
      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #333;
    }

    .annotation svg {
      display: block;
      overflow: visible;
    }

    .annotation path {
      fill: none;
      stroke: #333;
      stroke-width: 1.05;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* AMAZON */

    .annotation-amazon {
      left: 1%;
      top: 13%;
    }

    .annotation-amazon svg {
      width: 90px;
      height: 65px;
      margin-top: 5px;
      margin-left: 20px;
    }

    /* SENTRIX */

    .annotation-sentrix {
      right: 0%;
      top: 10%;
      text-align: right;
    }

    .annotation-sentrix svg {
      width: 90px;
      height: 65px;
      margin-top: 5px;
      margin-left: auto;
      margin-right: 16px;
    }

    /* GLOWR */

    .annotation-glowr {
      left: 1%;
      bottom: 25%;
    }

    .annotation-glowr svg {
      width: 88px;
      height: 60px;
      margin-top: 4px;
      margin-left: 18px;
    }

    /* MY CUNY EVENT */

    .annotation-mycuny {
      left: 53.5%;
      bottom: 14%;
      text-align: center;
    }

    .annotation-mycuny svg {
      width: 92px;
      height: 72px;
      display: block;
      margin: 0 auto 2px;
    }

    .annotation-mycuny .annotation-text {
      text-align: center;
    }

    /* PRELUDE */

    .annotation-prelude {
      right: 1%;
      bottom: 35%;
      text-align: right;
    }

    .annotation-prelude svg {
      width: 82px;
      height: 60px;
      margin-top: 5px;
      margin-left: auto;
      margin-right: 12px;
    }

    /* RIBBED GLASS / PLASTIC */

    .glass {
      position: absolute;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.48),
          rgba(255, 255, 255, 0.14)
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.76) 0px,
          rgba(255, 255, 255, 0.76) 4px,
          rgba(210, 210, 210, 0.16) 5px,
          rgba(255, 255, 255, 0.30) 8px,
          rgba(170, 170, 170, 0.10) 9px,
          rgba(255, 255, 255, 0.60) 12px
        );

      backdrop-filter: blur(14px) saturate(0.88);
      -webkit-backdrop-filter: blur(14px) saturate(0.88);

      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.045),
        inset 0 1px 0 rgba(255, 255, 255, 0.74),
        inset 0 -1px 0 rgba(255, 255, 255, 0.25);

      opacity: 0.86;
      pointer-events: none;
      z-index: 20;
    }

    .glass::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          110deg,
          rgba(255, 255, 255, 0.25),
          rgba(255, 255, 255, 0.03) 45%,
          rgba(255, 255, 255, 0.22)
        );
    }

    /* AMAZON LEFT */

    .glass-1 {
      width: 11%;
      height: 22%;
      left: 5%;
      top: 28%;
      transform: rotate(-5deg);
    }

    /* MYCUNYEVENT - DOLNA POZIOMA */

    .glass-2 {
      width: 15%;
      height: 13%;
      left: 41.5%;
      bottom: 11%;
      transform: rotate(3deg);
    }

    /* SENTRIX - ZA ROBOTEM */

    .glass-3 {
      width: 11%;
      height: 24%;
      right: 11%;
      top: 15%;
      transform: rotate(4deg);
      z-index: 2;
    }

    /* GLOWR */

    .glass-4 {
      width: 14%;
      height: 17%;
      left: 7%;
      bottom: 5%;
      transform: rotate(-4deg);
    }

    /* PRELUDE */

    .glass-5 {
      width: 18%;
      height: 16%;
      right: 3%;
      bottom: 3%;
      transform: rotate(4deg);
    }

    /* BOTTOM MARK */

    .design-mark {
      position: absolute;
      left: 1%;
      bottom: 0;

      display: flex;
      align-items: center;
      gap: 17px;

      z-index: 50;

      font-size: 8px;
      font-weight: 300;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #999;
    }

    .design-mark-line {
      width: 30px;
      height: 1px;
      background: #999;
    }

    /* MOBILE */

    @media (max-width: 850px) {
      .design-page {
        padding: 22px 18px 40px;
      }

      .top-nav {
        position: static;
        margin-top: 16px;
        justify-content: center;
        flex-wrap: wrap;
        gap: 22px;
      }

      .collage {
        width: 100%;
        height: auto;
        margin-top: 40px;

        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
      }

      .project {
        position: relative;
        inset: auto !important;
        width: 100% !important;
        height: 340px !important;
        transform: none !important;
      }

      .annotation,
      .glass,
      .design-mark {
        display: none;
      }
    }

    @media (max-width: 580px) {
      .collage {
        grid-template-columns: 1fr;
      }

      .project {
        height: 360px !important;
      }
    }
  </style>
</head>

<body>

  <main class="design-page">

    <header class="site-header">

      <a href="index.html" class="logo">
        wikivisual.co
      </a>

      <div class="section-title">
        Digital Design
      </div>

      <nav class="top-nav">
        <a href="photography.html">Photography</a>
        <a href="about.html">About Me</a>
        <a href="contact.html">Contact</a>
      </nav>

    </header>

    <section class="collage">

      <!-- PROJECTS -->

      <a href="#student-amazon-prime" class="project amazon">
        <img
          src="images/digital-design/amazon.png"

      </a>

      <a href="#sentrix" class="project sentrix">

      </a>

      <a href="#glowr" class="project glowr">

          src="images/digital-design/glowr.png"

        <img
          src="images/digital-design/prelude.png"

        />
      </a>

      <!-- AMAZON -->

      <div class="annotation annotation-amazon">
        <div class="annotation-text">

        </div>

        <svg viewBox="0 0 90 65">
          <path d="M 6 5 C 12 24, 30 40, 62 47" />
          <path d="M 53 40 L 65 48 L 52 54" />
        </svg>
      </div>

      <!-- SENTRIX -->

      <div class="annotation annotation-sentrix">
        <div class="annotation-text">
          Sentrix
        </div>

        <svg viewBox="0 0 90 65">
          <path d="M 84 5 C 78 24, 64 39, 39 47" />
          <path d="M 48 39 L 37 48 L 51 49" />
        </svg>
      </div>

      <!-- GLOWR -->

      <div class="annotation annotation-glowr">
        <div class="annotation-text">
          Glowr
        </div>

        <svg viewBox="0 0 88 60">
          <path d="M 5 5 C 12 24, 28 38, 59 44" />

        </svg>
      </div>

      <!-- MY CUNY EVENT -->

      <div class="annotation annotation-mycuny">

        <svg viewBox="0 0 92 72">
          <path d="M 79 65 C 68 52, 58 39, 40 23" />
          <path d="M 51 27 L 38 20 L 42 35" />
        </svg>

        <div class="annotation-text">

        </div>

      </div>

      <!-- PRELUDE -->

      <div class="annotation annotation-prelude">
        <div class="annotation-text">
          Prelude
        </div>

        <svg viewBox="0 0 82 60">
          <path d="M 77 5 C 73 23, 61 37, 39 45" />
          <path d="M 48 37 L 37 46 L 51 47" />
        </svg>
      </div>

      <!-- GLASS -->

      <div class="glass glass-1"></div>
      <div class="glass glass-2"></div>
      <div class="glass glass-3"></div>
      <div class="glass glass-4"></div>
      <div class="glass glass-5"></div>

      <!-- MARK -->

      <div class="design-mark">
        <div class="design-mark-line"></div>
        <span>Digital Design</span>
      </div>

    </section>

  </main>

</body>

</html>
