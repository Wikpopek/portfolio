<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Digital Design — wikivisual.co</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #fbfaf8;
      color: #151515;
      font-family: "IBM Plex Mono", monospace;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       PAGE
    ========================= */

    .design-page {
      width: 100%;
      min-height: 100vh;
      padding: 22px 30px 28px;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }

    .logo {
      font-size: clamp(24px, 2vw, 38px);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
      color: #111;
    }

    .section-title {
      margin-top: 9px;
      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #777;
    }

    .top-nav {
      position: absolute;
      top: 1px;
      right: 0;

      display: flex;
      align-items: center;
      gap: 28px;

      z-index: 9999;

      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #555;
    }

    .top-nav a {
      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .top-nav a:hover {
      opacity: 0.55;
      transform: translateY(-1px);
    }

    /* =========================
       DESKTOP COLLAGE
    ========================= */

    .collage {
      position: relative;
      width: min(1280px, 90vw);
      height: 800px;
      margin: 8px auto 0;
      overflow: visible;
    }

    .project {
      position: absolute;
      display: block;
      z-index: 5;
      cursor: pointer;

      transition:
        transform 0.4s ease;
    }

    .project:hover {
      z-index: 40;
    }

    .project img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;
      object-position: center;

      background: transparent;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* AMAZON */

    .amazon {
      width: 39%;
      height: 40%;
      left: 9%;
      top: 4%;
      transform: rotate(4deg);
    }

    .amazon:hover {
      transform: rotate(2deg) scale(1.02);
    }

    /* SENTRIX */

    .sentrix {
      width: 38%;
      height: 55%;
      right: -1%;
      top: 0%;
      transform: rotate(3deg);
    }

    .sentrix:hover {
      transform: rotate(1deg) scale(1.02);
    }

    /* VICTORIA */

    .victoria {
      width: 21%;
      height: 20%;
      left: 55%;
      top: 7%;
      transform: rotate(2deg);
      z-index: 12;
    }

    .victoria:hover {
      transform: rotate(0deg) scale(1.03);
    }

    /* MY CUNY EVENT */

    .mycunyevent {
      width: 37%;
      height: 54%;
      left: 31%;
      top: 22%;
      transform: rotate(-1deg);
      z-index: 10;
    }

    .mycunyevent:hover {
      transform: rotate(0deg) scale(1.02);
    }

    /* GLOWR */

    .glowr {
      width: 43%;
      height: 45%;
      left: 2%;
      bottom: 7%;
      transform: rotate(-3deg);
    }

    .glowr:hover {
      transform: rotate(-1deg) scale(1.02);
    }

    /* PRELUDE */

    .prelude {
      width: 29%;
      height: 31%;
      right: 10%;
      bottom: 12%;
      transform: rotate(-3deg);
    }

    .prelude:hover {
      transform: rotate(-1deg) scale(1.02);
    }

    /* =========================
       ANNOTATIONS
    ========================= */

    .annotation {
      position: absolute;
      z-index: 60;
      pointer-events: none;
    }

    .annotation-text {
      font-size: clamp(8px, 0.65vw, 11px);
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #333;
    }

    .annotation svg {
      display: block;
      overflow: visible;
    }

    .annotation path {
      fill: none;
      stroke: #333;
      stroke-width: 1.05;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .annotation-amazon {
      left: 1%;
      top: 13%;
    }

    .annotation-amazon svg {
      width: 90px;
      height: 65px;
      margin-top: 5px;
      margin-left: 20px;
    }

    .annotation-sentrix {
      right: -1%;
      top: 10%;
      text-align: right;
    }

    .annotation-sentrix svg {
      width: 90px;
      height: 65px;
      margin-top: 5px;
      margin-left: auto;
      margin-right: 16px;
    }

    .annotation-victoria {
      left: 65%;
      top: 25%;
      transform: translateX(-50%);
      text-align: center;
    }

    .annotation-victoria svg {
      width: 76px;
      height: 52px;
      margin: 0 auto 2px;
    }

    .annotation-glowr {
      left: 1%;
      bottom: 25%;
    }

    .annotation-glowr svg {
      width: 88px;
      height: 60px;
      margin-top: 4px;
      margin-left: 18px;
    }

    .annotation-mycuny {
      left: 53.5%;
      bottom: 14%;
      text-align: center;
    }

    .annotation-mycuny svg {
      width: 92px;
      height: 72px;
      display: block;
      margin: 0 auto 2px;
    }

    .annotation-prelude {
      right: 1%;
      bottom: 35%;
      text-align: right;
    }

    .annotation-prelude svg {
      width: 82px;
      height: 60px;
      margin-top: 5px;
      margin-left: auto;
      margin-right: 12px;
    }

    /* =========================
       GLASS
    ========================= */

    .glass {
      position: absolute;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.48),
          rgba(255,255,255,0.14)
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.76) 0px,
          rgba(255,255,255,0.76) 4px,
          rgba(210,210,210,0.16) 5px,
          rgba(255,255,255,0.30) 8px,
          rgba(170,170,170,0.10) 9px,
          rgba(255,255,255,0.60) 12px
        );

      backdrop-filter: blur(14px) saturate(0.88);
      -webkit-backdrop-filter: blur(14px) saturate(0.88);

      opacity: 0.86;
      pointer-events: none;
      z-index: 20;
    }

    .glass-1 {
      width: 11%;
      height: 22%;
      left: 5%;
      top: 28%;
      transform: rotate(-5deg);
    }

    .glass-2 {
      width: 15%;
      height: 13%;
      left: 41.5%;
      bottom: 11%;
      transform: rotate(3deg);
    }

    .glass-3 {
      width: 11%;
      height: 24%;
      right: 11%;
      top: 15%;
      transform: rotate(4deg);
      z-index: 2;
    }

    .glass-4 {
      width: 14%;
      height: 17%;
      left: 7%;
      bottom: 5%;
      transform: rotate(-4deg);
    }

    .glass-5 {
      width: 18%;
      height: 16%;
      right: 3%;
      bottom: 3%;
      transform: rotate(4deg);
    }

    /* =========================
       DESIGN MARK
    ========================= */

    .design-mark {
      position: absolute;
      left: 1%;
      bottom: 0;

      display: flex;
      align-items: center;
      gap: 17px;

      z-index: 50;

      font-size: 8px;
      font-weight: 300;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #999;
    }

    .design-mark-line {
      width: 30px;
      height: 1px;
      background: #999;
    }

    /* =========================
       MODALS
    ========================= */

    body.project-open {
      overflow: hidden;
    }

    .project-overlay {
      position: fixed;
      inset: 0;

      z-index: 20000;

      display: none;

      width: 100%;
      height: 100vh;

      padding: 5vh 5vw;

      justify-content: center;
      align-items: center;

      background:
        rgba(20, 20, 20, 0.15);

      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .project-overlay.is-open {
      display: flex;
    }

    .project-view {
      position: relative;

      width: min(900px, 86vw);
      max-height: 84vh;

      padding: 16px;

      background: #fbfaf8;

      overflow-y: auto;
      overflow-x: hidden;

      border-radius: 3px;

      box-shadow:
        0 30px 80px
        rgba(0, 0, 0, 0.22);

      animation:
        projectAppear
        0.32s ease;
    }

    @keyframes projectAppear {

      from {
        opacity: 0;

        transform:
          translateY(14px)
          scale(0.97);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

    .project-image-wrap {
      position: relative;
      width: 100%;
      margin: 0 auto;
    }

    .project-image-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* CLOSE */

    .project-close {
      position: fixed;

      top: 25px;
      right: 30px;

      z-index: 20005;

      width: 42px;
      height: 42px;

      border: none;

      border-radius: 50%;

      background:
        rgba(255,255,255,0.95);

      color: #151515;

      font-family:
        "IBM Plex Mono",
        monospace;

      font-size: 27px;
      font-weight: 300;

      line-height: 1;

      cursor: pointer;

      box-shadow:
        0 6px 22px
        rgba(0,0,0,0.10);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .project-close:hover {
      opacity: 0.65;

      transform:
        rotate(8deg);
    }

    /* =========================
       TEST LINKS
    ========================= */

    .test-link {
      position: absolute;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 500;

      display: inline-block;

      font-size: 42px;
      font-weight: 600;

      letter-spacing: 0.06em;
      line-height: 1;

      text-transform: uppercase;

      color: #000;

      border-bottom:
        5px solid #000;

      padding-bottom: 6px;

      background: transparent;

      cursor: pointer;
    }

    .mycuny-test-link {
      top: 65%;
    }

    .glowr-test-link {
      top: 79%;
    }

    /* =========================
       VICTORIA MODAL
    ========================= */

    .victoria-project-view {
      position: relative;

      width: min(1000px, 90vw);
      max-height: 86vh;

      padding: 18px;

      background: #fbfaf8;

      overflow-y: auto;
      overflow-x: hidden;

      border-radius: 3px;

      box-shadow:
        0 30px 80px
        rgba(0,0,0,0.22);

      animation:
        projectAppear
        0.32s ease;
    }

    .victoria-hero {
      width: 100%;
      margin: 0 auto;
    }

    .victoria-hero img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* =========================
       BROCHURE
    ========================= */

    .brochure-section {
      width: 100%;

      margin-top: 45px;

      padding:
        55px
        15px
        65px;

      background: #fff;

      text-align: center;
    }

    .brochure-heading {
      font-size:
        clamp(
          16px,
          1.5vw,
          23px
        );

      font-weight: 400;

      letter-spacing: 0.08em;

      text-transform: uppercase;
    }

    .brochure-subtitle {
      margin-top: 10px;
      margin-bottom: 35px;

      font-size: 8px;

      letter-spacing: 0.16em;

      text-transform: uppercase;

      color: #888;
    }

    .brochure-stage {
      width: 100%;

      min-height: 620px;

      display: flex;

      justify-content: center;
      align-items: center;

      overflow: hidden;

      perspective: 2200px;
    }

    #victoria-book {
      margin: 0 auto;
    }

    .brochure-page {
      background: #fff;
      overflow: hidden;
    }

    .brochure-page canvas {
      display: block;

      width: 100%;
      height: 100%;

      background: #fff;
    }

    .brochure-loading {
      padding: 80px 20px;

      font-size: 10px;

      letter-spacing: 0.15em;

      text-transform: uppercase;

      color: #999;
    }

    .brochure-controls {
      margin-top: 30px;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 30px;
    }

    .brochure-controls button {
      border: none;

      background: transparent;

      font-family:
        "IBM Plex Mono",
        monospace;

      font-size: 9px;

      letter-spacing: 0.16em;

      cursor: pointer;
    }

    #brochure-page-number {
      font-size: 9px;
      color: #999;
    }


    /* ==========================================
       MOBILE
       COMPLETELY DIFFERENT LAYOUT
    ========================================== */

    @media (max-width: 850px) {

      body {
        background: #fbfaf8;
      }


      .design-page {
        padding:
          20px
          16px
          50px;
      }


      /* HEADER */

      .site-header {
        align-items: flex-start;
      }


      .logo {
        font-size: 28px;
      }


      .section-title {
        margin-top: 8px;

        font-size: 9px;

        letter-spacing: 0.22em;
      }


      .top-nav {
        position: static;

        width: 100%;

        margin-top: 22px;

        display: flex;

        justify-content: flex-start;

        gap: 18px;

        flex-wrap: wrap;

        font-size: 9px;
      }


      /* PROJECT LIST */

      .collage {
        width: 100%;

        height: auto;

        margin-top: 42px;

        display: flex;

        flex-direction: column;

        gap: 40px;
      }


      /* PROJECT */

      .project {
        position: relative !important;

        inset: auto !important;

        width: 100% !important;

        height: auto !important;

        transform: none !important;

        display: block;

        z-index: auto;

        padding-bottom: 15px;

        border-bottom:
          1px solid
          rgba(0,0,0,0.12);
      }


      .project:hover {
        transform: none !important;
      }


      .project img {
        width: 100%;

        height: auto;

        display: block;

        object-fit: contain;

        transform: none !important;
      }


      /* HIDE DESKTOP DECORATION */

      .annotation,
      .glass,
      .design-mark {
        display: none;
      }


      /* MOBILE PROJECT NAMES */

      .project::after {
        display: block;

        margin-top: 13px;

        font-family:
          "IBM Plex Mono",
          monospace;

        font-size: 10px;

        font-weight: 400;

        letter-spacing: 0.15em;

        text-transform: uppercase;

        color: #222;
      }


      .amazon::after {
        content:
          "Student Amazon Prime";
      }


      .sentrix::after {
        content:
          "Sentrix";
      }


      .victoria::after {
        content:
          "Victoria Cruises";
      }


      .mycunyevent::after {
        content:
          "myCUNYevent";
      }


      .glowr::after {
        content:
          "Glowr";
      }


      .prelude::after {
        content:
          "Prelude";
      }


      /* MODAL MOBILE */

      .project-overlay {
        padding:
          18px
          12px;

        align-items: center;

        background:
          rgba(
            20,
            20,
            20,
            0.22
          );
      }


      .project-view {
        width: 100%;

        max-height: 88vh;

        padding: 10px;

        border-radius: 2px;
      }


      .project-image-wrap {
        width: 100%;
      }


      .project-image-wrap img {
        width: 100%;

        height: auto;
      }


      .project-close {
        top: 12px;

        right: 12px;

        width: 38px;

        height: 38px;

        font-size: 23px;
      }


      /* TEST LINKS */

      .test-link {
        font-size: 24px;

        border-bottom:
          3px solid #000;

        padding-bottom: 4px;
      }


      .mycuny-test-link {
        top: 65%;
      }


      .glowr-test-link {
        top: 79%;
      }


      /* VICTORIA */

      .victoria-project-view {
        width: 100%;

        max-height: 88vh;

        padding: 10px;
      }


      .victoria-hero {
        width: 100%;
      }


      .brochure-section {
        margin-top: 30px;

        padding:
          40px
          8px
          50px;
      }


      .brochure-heading {
        font-size: 16px;
      }


      .brochure-subtitle {
        margin-top: 8px;

        margin-bottom: 28px;

        font-size: 8px;
      }


      .brochure-stage {
        min-height: 480px;
      }


      .brochure-controls {
        margin-top: 25px;

        gap: 14px;
      }


      .brochure-controls button {
        font-size: 8px;
      }


      #brochure-page-number {
        font-size: 8px;
      }

    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 520px) {

      .design-page {
        padding:
          18px
          14px
          40px;
      }


      .logo {
        font-size: 25px;
      }


      .top-nav {
        gap: 14px;

        font-size: 8px;
      }


      .collage {
        margin-top: 34px;

        gap: 34px;
      }


      .project::after {
        margin-top: 10px;

        font-size: 9px;

        letter-spacing: 0.14em;
      }


      .project-overlay {
        padding:
          12px
          8px;
      }


      .project-view {
        width: 96vw;

        max-height: 90vh;
      }


      .victoria-project-view {
        width: 96vw;

        max-height: 90vh;
      }


      .brochure-stage {
        min-height: 430px;
      }


      .brochure-controls {
        gap: 10px;
      }


      .test-link {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>

  <main class="design-page">

    <header class="site-header">

      <a
        href="index.html"
        class="logo"
      >
        wikivisual.co
      </a>

      <div class="section-title">
        Digital Design
      </div>

      <nav class="top-nav">

        <a href="photography.html">
          Photography
        </a>

        <a href="about.html">
          About Me
        </a>

        <a href="contact.html">
          Contact
        </a>

      </nav>

    </header>


    <section class="collage">


      <!-- AMAZON -->

      <a
        href="#"
        class="project amazon"
        data-project="amazon-project"
      >

        <img
          src="images/digital-design/amazon.png"
          alt="Student Amazon Prime"
        />

      </a>


      <!-- SENTRIX -->

      <a
        href="#"
        class="project sentrix"
        data-project="sentrix-project"
      >

        <img
          src="images/digital-design/sentrix.png"
          alt="Sentrix"
        />

      </a>


      <!-- VICTORIA -->

      <a
        href="#"
        class="project victoria"
        data-project="victoria-project"
      >

        <img
          src="images/digital-design/victoria-cruises.png"
          alt="Victoria Cruises"
        />

      </a>


      <!-- MY CUNY -->

      <a
        href="#"
        class="project mycunyevent"
        data-project="mycunyevent-project"
      >

        <img
          src="images/digital-design/mycunyevent.png"
          alt="myCUNYevent"
        />

      </a>


      <!-- GLOWR -->

      <a
        href="#"
        class="project glowr"
        data-project="glowr-project"
      >

        <img
          src="images/digital-design/glowr.png"
          alt="Glowr"
        />

      </a>


      <!-- PRELUDE -->

      <a
        href="#"
        class="project prelude"
        data-project="prelude-project"
      >

        <img
          src="images/digital-design/prelude.png"
          alt="Prelude"
        />

      </a>


      <!-- AMAZON LABEL -->

      <div class="annotation annotation-amazon">

        <div class="annotation-text">
          Student Amazon Prime
        </div>

        <svg viewBox="0 0 90 65">

          <path
            d="M 6 5 C 12 24, 30 40, 62 47"
          />

          <path
            d="M 53 40 L 65 48 L 52 54"
          />

        </svg>

      </div>


      <!-- SENTRIX LABEL -->

      <div class="annotation annotation-sentrix">

        <div class="annotation-text">
          Sentrix
        </div>

        <svg viewBox="0 0 90 65">

          <path
            d="M 84 5 C 78 24, 64 39, 39 47"
          />

          <path
            d="M 48 39 L 37 48 L 51 49"
          />

        </svg>

      </div>


      <!-- VICTORIA LABEL -->

      <div class="annotation annotation-victoria">

        <svg viewBox="0 0 76 52">

          <path
            d="M 38 50 C 38 38, 38 27, 38 14"
          />

          <path
            d="M 31 24 L 38 13 L 45 24"
          />

        </svg>

        <div class="annotation-text">
          Victoria Cruises
        </div>

      </div>


      <!-- GLOWR LABEL -->

      <div class="annotation annotation-glowr">

        <div class="annotation-text">
          Glowr
        </div>

        <svg viewBox="0 0 88 60">

          <path
            d="M 5 5 C 12 24, 28 38, 59 44"
          />

          <path
            d="M 50 37 L 62 45 L 49 51"
          />

        </svg>

      </div>


      <!-- CUNY LABEL -->

      <div class="annotation annotation-mycuny">

        <svg viewBox="0 0 92 72">

          <path
            d="M 79 65 C 68 52, 58 39, 40 23"
          />

          <path
            d="M 51 27 L 38 20 L 42 35"
          />

        </svg>

        <div class="annotation-text">
          mycunyevent
        </div>

      </div>


      <!-- PRELUDE LABEL -->

      <div class="annotation annotation-prelude">

        <div class="annotation-text">
          Prelude
        </div>

        <svg viewBox="0 0 82 60">

  ></script>


  <script>

    /* =========================
       PROJECT MODALS
    ========================= */

    const projectTriggers =
      document.querySelectorAll(
        "[data-project]"
      );


    const projectOverlays =
      document.querySelectorAll(
        ".project-overlay"
      );


    const closeButtons =
      document.querySelectorAll(
        ".project-close"
      );


    function openProject(projectId) {

      const overlay =
        document.getElementById(
          projectId
        );


      if (!overlay) return;


      overlay.classList.add(
        "is-open"
      );


      document.body.classList.add(
        "project-open"
      );


      if (
        projectId ===
        "victoria-project"
      ) {

        setTimeout(
          initializeVictoriaBook,
          200
        );

      }

    }


    function closeProject(overlay) {

      if (!overlay) return;


      overlay.classList.remove(
        "is-open"
      );


      document.body.classList.remove(
        "project-open"
      );

    }


    projectTriggers.forEach(
      function(trigger) {

        trigger.addEventListener(
          "click",
          function(event) {

            event.preventDefault();


            const projectId =
              trigger.dataset.project;


            openProject(
              projectId
            );

          }
        );

      }
    );


    closeButtons.forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            const overlay =
              button.closest(
                ".project-overlay"
              );


            closeProject(
              overlay
            );

          }
        );

      }
    );


    /* CLICK OUTSIDE */

    projectOverlays.forEach(
      function(overlay) {

        overlay.addEventListener(
          "click",
          function(event) {

            if (
              event.target ===
              overlay
            ) {

              closeProject(
                overlay
              );

            }

          }
        );

      }
    );


    /* ESC */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          projectOverlays.forEach(
            function(overlay) {

              if (
                overlay
                  .classList
                  .contains(
                    "is-open"
                  )
              ) {

                closeProject(
                  overlay
                );

              }

            }
          );

        }

      }
    );


    /* =========================
       VICTORIA PDF
    ========================= */


    const pdfPath =
      "images/digital-design/victoria-brochure.pdf";


    let victoriaBook =
      null;


    let victoriaPdf =
      null;


    async function initializeVictoriaBook() {


      if (victoriaBook) {
        return;
      }


      const bookElement =
        document.getElementById(
          "victoria-book"
        );


      const loading =
        document.getElementById(
          "brochure-loading"
        );


      if (!bookElement) {
        return;
      }


      try {


        pdfjsLib
          .GlobalWorkerOptions
          .workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        victoriaPdf =
          await pdfjsLib
            .getDocument(
              pdfPath
            )
            .promise;


        bookElement.innerHTML =
          "";


        for (
          let pageNumber = 1;

          pageNumber <=
          victoriaPdf.numPages;

          pageNumber++
        ) {


          const page =
            await victoriaPdf
              .getPage(
                pageNumber
              );


          const viewport =
            page.getViewport({
              scale: 2
            });


          const pageElement =
            document.createElement(
              "div"
            );


          pageElement.classList.add(
            "brochure-page"
          );


          const canvas =
            document.createElement(
              "canvas"
            );


          const context =
            canvas.getContext(
              "2d"
            );


          canvas.width =
            Math.floor(
              viewport.width
            );


          canvas.height =
            Math.floor(
              viewport.height
            );


          await page
            .render({

              canvasContext:
                context,

              viewport:
                viewport

            })
            .promise;


          pageElement.appendChild(
            canvas
          );


          bookElement.appendChild(
            pageElement
          );

        }


        victoriaBook =
          new St.PageFlip(
            bookElement,
            {

              width: 595,

              height: 842,

              size:
                "stretch",

              minWidth: 260,

              maxWidth: 520,

              minHeight: 368,

              maxHeight: 736,

              showCover: true,

              usePortrait: true,

              mobileScrollSupport: false,

              maxShadowOpacity: 0.28,

              flippingTime: 750

            }
          );


        victoriaBook.loadFromHTML(

          document.querySelectorAll(
            "#victoria-book .brochure-page"
          )

        );


        victoriaBook.on(
          "flip",
          function(event) {

            updateBrochureCounter(
              event.data
            );

          }
        );


        updateBrochureCounter(0);


      } catch(error) {


        console.error(error);


        if (loading) {

          loading.textContent =
            "Brochure could not be loaded.";

        } else {

          bookElement.innerHTML =
            '<div class="brochure-loading">Brochure could not be loaded.</div>';

        }

      }

    }


    function updateBrochureCounter(
      pageIndex
    ) {


      const counter =
        document.getElementById(
          "brochure-page-number"
        );


      if (!counter) {
        return;
      }


      const current =
        String(
          pageIndex + 1
        ).padStart(
          2,
          "0"
        );


      const total =
        victoriaPdf
          ?
          String(
            victoriaPdf.numPages
          ).padStart(
            2,
            "0"
          )
          :
          "12";


      counter.textContent =
        current +
        " / " +
        total;

    }


    document
      .getElementById(
        "brochure-prev"
      )
      ?.addEventListener(
        "click",
        function() {

          if (victoriaBook) {

            victoriaBook.flipPrev();

          }

        }
      );


    document
      .getElementById(
        "brochure-next"
      )
      ?.addEventListener(
        "click",
        function() {

          if (victoriaBook) {

            victoriaBook.flipNext();

          }

        }
      );

  </script>
