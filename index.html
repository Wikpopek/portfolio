<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>wikivisual.co</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #eee9e1;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #eee9e1;
    }

    .hero-background {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      z-index: 1;

      pointer-events: none;
      user-select: none;
    }

    .hero-logo {
      position: absolute;

      top: 7%;
      left: 50%;

      transform: translateX(-50%);

      z-index: 5;

      width: clamp(150px, 17vw, 300px);

      filter: blur(1.4px);

      opacity: 1;

      pointer-events: none;
      user-select: none;
    }

    .hero-link {
      position: absolute;

      z-index: 6;

      display: block;

      text-decoration: none;
      cursor: pointer;

      transition:
        transform 0.7s cubic-bezier(.22,.61,.36,1);
    }

    .hero-link img {
      display: block;

      width: 100%;
      height: auto;

      filter: blur(3.5px);

      opacity: 0.9;

      transition:
        filter 0.75s ease,
        opacity 0.75s ease,
        transform 0.75s cubic-bezier(.22,.61,.36,1);
    }

    .photography-link {
      left: 5.5%;
      top: 41%;

      width: clamp(260px, 27vw, 520px);
    }

    .digital-link {
      right: 5%;
      top: 41%;

      width: clamp(300px, 29vw, 560px);
    }

    .hero-link:hover img,
    .hero-link:focus-visible img {
      filter: blur(1.8px);
      opacity: 1;
      transform: scale(1.005);
    }

    .hero-link:hover,
    .hero-link:focus-visible {
      transform: translateY(-1px);
      outline: none;
    }

    .hero.exit {
      animation: exitPage 0.55s ease forwards;
    }

    @keyframes exitPage {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform: scale(1.01);
      }
    }

    @media (max-width: 900px) {

      .hero-logo {
        top: 6%;
        width: clamp(140px, 34vw, 230px);
      }

      .photography-link {
        left: 4%;
        top: auto;
        bottom: 16%;
        width: clamp(180px, 38vw, 300px);
      }

      .digital-link {
        right: 4%;
        top: auto;
        bottom: 16%;
        width: clamp(200px, 40vw, 320px);
      }
    }

    @media (max-width: 620px) {

      .photography-link {
        left: 3%;
        bottom: 13%;
        width: 42vw;
      }

      .digital-link {
        right: 3%;
        bottom: 13%;
        width: 44vw;
      }
    }

  </style>
</head>

<body>

  <main class="hero" id="hero">

    <img
      src="images/hero-clean.png"
      class="hero-background"
      alt=""
    >

    <img
      src="images/logo.png"
      class="hero-logo"
      alt="wikivisual.co"
    >

    <a
      href="photography.html"
      class="hero-link photography-link"
    >
      <img
        src="images/photography.png"
        alt="Photography"
      >
    </a>

    <a
      href="digital-design.html"
      class="hero-link digital-link"
    >
      <img
        src="images/digital-design.png"
        alt="Digital Design"
      >
    </a>

  </main>

  <script>

    const hero =
      document.getElementById("hero");

    const links =
      document.querySelectorAll(".hero-link");

    links.forEach(link => {

      link.addEventListener("click", function(event) {

        event.preventDefault();

        const destination =
          this.getAttribute("href");

        hero.classList.add("exit");

        setTimeout(() => {
          window.location.href = destination;
        }, 500);

      });

    });

  </script>

</body>

</html>
